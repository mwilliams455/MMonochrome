name: Build MMonochrome RAWSCALAR1B FIXEDD65

on:
  workflow_dispatch:
  push:
    branches:
      - apk/mono1a-rawscalar1b-fixedd65
    paths:
      - 'apk/mono1a/**'
      - '.github/workflows/build-mono1a-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout MMonochrome overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout frozen M9 Android scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1

      - name: Verify pinned upstream identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C m9base rev-parse HEAD)" = "fb1db92ef78df70442b9fee879795e584f2170cf"
          python3 -m py_compile apk/mono1a/apply-mono1a.py
          python3 -m py_compile apk/mono1a/apply-source1d.py
          python3 -m py_compile apk/mono1a/apply-rawscalar1a.py
          python3 -m py_compile apk/mono1a/apply-rawscalar1b.py
          echo "M9_ANDROID_BASE=fb1db92ef78df70442b9fee879795e584f2170cf" | tee MONO1A_UPSTREAM.txt
          echo "M9_SUCCESSFUL_REFERENCE_RUN=34610280688" | tee -a MONO1A_UPSTREAM.txt
          echo "MM_CURVE02_SHA256=7a7ccd9021cf9881384b733236fe249d2088358705d8db282687e943aa990752" | tee -a MONO1A_UPSTREAM.txt
          echo "SOURCE_REVISION=MONO1A_RAWSCALAR1B_FIXED_D65" | tee -a MONO1A_UPSTREAM.txt
          echo "SOURCE1E_CLOSURE_HEAD=6eae8951975a6e0733db0fa39dc1fdcfb39539bc" | tee -a MONO1A_UPSTREAM.txt

      - name: Verify frozen M9 patch syntax
        working-directory: m9base
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-basishsm1p-demosaicmhc1a.py
          python3 -m py_compile patches/fix-m9cam-basishsm1p-demosaicmhc1a-lifetime1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-demosaicmhc1a.py
          python3 -m py_compile patches/apply-m9cam-basishsm1p-demosaicab1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-demosaicab1a.py
          python3 -m py_compile patches/apply-m9cam-basishsm1p-demosaicmhcneutral1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a.py
          python3 -m py_compile patches/promote-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py
          python3 -m py_compile patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py

      - name: Replay exact frozen M9 parent assembly
        working-directory: m9base
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_WORKSPACE="$PWD"
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-m9cam-basishsm1p-curvedomain1c-upstreamaxis1a.yml')
          lines = wf.read_text().splitlines()
          names = ['Replay exact CURVEDOMAIN1B parent assembly','Apply CURVEDOMAIN1C UPSTREAMAXIS1A read-only extension']
          for idx,name in enumerate(names):
              target='      - name: '+name
              i=lines.index(target)
              while i<len(lines) and lines[i].strip()!='run: |': i+=1
              if i>=len(lines): raise SystemExit('parent run block missing: '+name)
              i+=1; out=[]
              while i<len(lines):
                  line=lines[i]
                  if line.startswith('      - name:'): break
                  if line.startswith('          '): out.append(line[10:])
                  elif not line.strip(): out.append('')
                  else: raise SystemExit('unexpected parent indentation: '+line)
                  i+=1
              Path(f'/tmp/mono1a_upstreamaxis_parent_{idx}.sh').write_text('\n'.join(out)+'\n')
          PY
          for s in /tmp/mono1a_upstreamaxis_parent_*.sh; do bash "$s"; done

      - name: Apply validated frozen MHC demosaic chain
        working-directory: m9base
        run: |
          set -euxo pipefail
          ROOT="$PWD/PhotonCamera"
          python3 patches/apply-m9cam-basishsm1p-demosaicmhc1a.py "$ROOT"
          python3 patches/fix-m9cam-basishsm1p-demosaicmhc1a-lifetime1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhc1a.py "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-demosaicab1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicab1a.py "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-demosaicmhcneutral1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a.py "$ROOT"
          python3 patches/promote-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py "$ROOT"

      - name: Apply MONO1A SOURCE1D RAWSCALAR1A and RAWSCALAR1B overlays
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 apk/mono1a/apply-mono1a.py "$ROOT"
          python3 apk/mono1a/apply-source1d.py "$ROOT"
          python3 apk/mono1a/apply-rawscalar1a.py "$ROOT"
          python3 apk/mono1a/apply-rawscalar1b.py "$ROOT"

      - name: Verify RAWSCALAR1B isolation and frozen tone stage
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          R="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          N="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java"
          C="$ROOT/app/src/main/cpp/m9color_jni.cpp"
          G="$ROOT/app/build.gradle"
          grep -n 'MONO1A_ENABLED = true' "$R"
          grep -n 'firmware_curve02_normalISO_sRGB_Standard' "$R"
          grep -n 'curve02Sha256.*7a7ccd9021cf9881384b733236fe249d2088358705d8db282687e943aa990752' "$R"
          grep -n 'RAWSCALAR1A' "$R" "$C"
          grep -n 'RAWSCALAR1B_FIXED_D65' "$R"
          grep -n 'mmonochrome.rawscalar1b.fixedd65.v1' "$R"
          grep -n 'perShotNeutralUsed.*false' "$R"
          grep -n 'referenceIlluminant.*D65' "$R"
          grep -n 'fixedNeutralDerivation' "$R"
          grep -n '_MONO_RAWSCALAR1A.jpg' "$R"
          grep -n '_MONO_RAWSCALAR1B_D65.jpg' "$R"
          grep -n 'same_MHC_5x5_kernel_as_RAWSCALAR1A' "$R"
          grep -n 'm9LumaCoefficientsApplied.*false' "$R"
          grep -n 'xyzLumaCoefficientsApplied.*false' "$R"
          grep -n 'leicaSpectralTruth.*false' "$R"
          grep -n 'renderMonochrome1ARawScalarDirectBitmap' "$R" "$N" "$C"
          grep -n 'MM_MONO1A_CURVE02\[2048\]' "$C"
          grep -n 'applicationId.*com.m9project.mmonochrome.photon' "$G"
          ! grep -q 'applicationId.*com.m9project.m9cam.photon' "$G"

      - name: Snapshot RAWSCALAR1B assembled source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          mkdir -p rawscalar1b-assembled-source
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" rawscalar1b-assembled-source/
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9NativeColorCore.java" rawscalar1b-assembled-source/
          cp "$ROOT/app/src/main/cpp/m9color_jni.cpp" rawscalar1b-assembled-source/
          cp "$ROOT/app/build.gradle" rawscalar1b-assembled-source/app-build.gradle
          cp MONO1A_UPSTREAM.txt rawscalar1b-assembled-source/
          sha256sum rawscalar1b-assembled-source/* | tee rawscalar1b-assembled-source/SHA256SUMS.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build RAWSCALAR1B debug APK
        shell: bash
        run: |
          set -o pipefail
          cd m9base/PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/RAWSCALAR1B_GRADLE.log"

      - name: Record APK SHA256
        if: success()
        run: |
          set -euo pipefail
          sha256sum m9base/PhotonCamera/app/build/outputs/apk/debug/*.apk | tee RAWSCALAR1B_APK_SHA256.txt

      - name: Upload RAWSCALAR1B build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-RAWSCALAR1B-BUILDLOG
          path: RAWSCALAR1B_GRADLE.log
          if-no-files-found: ignore

      - name: Upload RAWSCALAR1B assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-RAWSCALAR1B-ASSEMBLED-SOURCE
          path: rawscalar1b-assembled-source/
          if-no-files-found: ignore

      - name: Upload RAWSCALAR1B APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-RAWSCALAR1B-FIXEDD65
          path: |
            m9base/PhotonCamera/app/build/outputs/apk/debug/*.apk
            RAWSCALAR1B_APK_SHA256.txt
            MONO1A_UPSTREAM.txt
          if-no-files-found: error
