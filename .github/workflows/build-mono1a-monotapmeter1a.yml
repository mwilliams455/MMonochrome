name: Build MMonochrome MONOTAPMETER1A Low-Key Tap Exposure

on:
  workflow_dispatch:
  push:
    branches: [research/monotapmeter1a]
    paths:
      - 'apk/mono1a/monotapmeter1a/**'
      - '.github/workflows/build-mono1a-monotapmeter1a.yml'

permissions:
  contents: read
concurrency:
  group: mono-tapmeter1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monochrom overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout frozen Android scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1
      - name: Checkout pinned portability tools
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'numpy==2.3.5' 'tifffile==2026.5.15'
      - name: Assemble exact validated 1H parent
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apk/mono1a/monotapmeter1a/*.py
          python3 -u - <<'PY' 2>&1 | tee MONOTAPMETER1A_PARENT.log
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono1a-monoauto1d1g.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0;count=0
          while i<stop:
              if lines[i].strip()!='run: |':
                  i+=1;continue
              i+=1;block=[]
              while i<stop and not lines[i].startswith('      - name: '):
                  line=lines[i]
                  if line.startswith('          '):block.append(line[10:])
                  elif not line.strip():block.append('')
                  else:raise SystemExit('Unexpected parent boundary '+line)
                  i+=1
              count+=1
              p=Path('/tmp/monotap-parent-%d.sh'%count);p.write_text('\n'.join(block)+'\n')
              subprocess.run(['bash',str(p)],check=True)
          assert count==3,count
          print('MONOAUTO1D1G parent assembly/tests PASS')
          PY
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 -u apk/mono1a/monoauto1d1h/apply.py "$ROOT" 2>&1 | tee MONOTAPMETER1A_1H_APPLY.txt
          python3 -u apk/mono1a/monoauto1d1h/test.py "$ROOT" 2>&1 | tee MONOTAPMETER1A_1H_TESTS.txt
      - name: Apply and host-test Monochrom tap meter
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 -u apk/mono1a/monotapmeter1a/apply.py "$ROOT" 2>&1 | tee MONOTAPMETER1A_APPLY.txt
          python3 -u apk/mono1a/monotapmeter1a/test.py "$ROOT" 2>&1 | tee MONOTAPMETER1A_TESTS.txt
      - name: Snapshot readable source evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/monotapmeter1a-evidence"
          mkdir -p "$OUT/source"
          cp "$ROOT/MONOTAPMETER1A_ISOLATION.json" "$ROOT/MONOTAPMETER1A_TEST_REPORT.json" "$OUT/"
          cp apk/mono1a/monotapmeter1a/README.md apk/mono1a/monotapmeter1a/*.py apk/mono1a/monotapmeter1a/*.java "$OUT/"
          files=(
            app/src/main/java/com/particlesdevs/photoncamera/control/Swipe.java
            app/src/main/java/com/particlesdevs/photoncamera/control/TouchFocus.java
            app/src/main/java/com/particlesdevs/photoncamera/ui/camera/CameraFragment.java
            app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/GLPreview.java
            app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/MainRenderer.java
            app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/SurfaceViewOverViewfinder.java
            app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java
            app/src/main/java/com/particlesdevs/photoncamera/m9/exposure/MonoPlacementAssist1D.java
            app/src/main/java/com/particlesdevs/photoncamera/m9/preview/MonoGpuPreview2A.java
            app/src/main/java/com/particlesdevs/photoncamera/m9/preview/MonoTapMeter1A.java
          )
          for f in "${files[@]}";do mkdir -p "$OUT/source/$(dirname "$f")";cp "$ROOT/$f" "$OUT/source/$f";done
          printf 'REVISION=MONOTAPMETER1A_LOWKEYREAD1A\nCOMMIT=%s\nPARENT=8b9d7ade66c9772c654b8efb51a93768d312bfb7\nTAP_MEDIAN_FLOOR_SOURCE1D=0.050\nTAP_Q25_FLOOR_SOURCE1D=0.015\nTAP_MEDIAN_APPEARANCE_CEILING_SOURCE1D=0.065\nTAP_MAX_POSITIVE_EV=0.40\nNO_TAP_POLICY_CHANGED=0\nHDR=0\nLOCAL_RELIGHTING=0\n' "$GITHUB_SHA" > "$OUT/PROVENANCE.txt"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Build MONOTAPMETER1A APK
        shell: bash
        run: |
          set -o pipefail
          cd m9base/PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/MONOTAPMETER1A_GRADLE.log"
      - name: Verify packaged markers and frozen output seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee MONOTAPMETER1A_APK_PROOF.txt
          from pathlib import Path
          import zipfile,hashlib,json,shutil
          root=Path('m9base/PhotonCamera');apks=list((root/'app/build/outputs/apk/debug').glob('*.apk'));assert len(apks)==1
          with zipfile.ZipFile(apks[0]) as z:
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for marker in [b'MONOTAPMETER1A',b'MONOTAPMETER1A_LOWKEYREAD1A',b'monotap1a_bounded_subject_readability_lift',
                  b'MONOAUTO1D_PLACEMENTASSIST1E_BUFFERHYGIENE1A',b'MONOOUTPUT1H_SAVELOOKUP1A',b'MONOOUTPUT1E_BASELINE_IFD0']:
                  assert marker in dex,marker
          proof=json.loads((root/'MONOTAPMETER1A_ISOLATION.json').read_text())
          for rel,expected in proof['frozen'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==expected,rel
          assert proof['noTapAutomaticPolicyMethodByteIdentical']
          assert not proof['rendererChanged'] and not proof['dngPixelMathChanged'] and not proof['curve02Changed']
          assert proof['tapPositiveOnly'] and not proof['HDR'] and not proof['localRelighting']
          out=Path('MMonochrome_MONOTAPMETER1A_LOWKEYREAD1A.apk');shutil.copyfile(apks[0],out)
          digest=hashlib.sha256(out.read_bytes()).hexdigest();Path('MONOTAPMETER1A_APK_SHA256.txt').write_text(digest+'  '+out.name+'\n')
          print('PASS MONOTAPMETER1A package',digest,out.stat().st_size)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOTAPMETER1A-LOWKEYREAD1A-EVIDENCE
          path: |
            MONOTAPMETER1A_*.log
            MONOTAPMETER1A_*.txt
            monotapmeter1a-evidence/
          if-no-files-found: warn
      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOTAPMETER1A-LOWKEYREAD1A
          path: |
            MMonochrome_MONOTAPMETER1A_LOWKEYREAD1A.apk
            MONOTAPMETER1A_APK_SHA256.txt
            MONOTAPMETER1A_APK_PROOF.txt
            monotapmeter1a-evidence/PROVENANCE.txt
          if-no-files-found: error
