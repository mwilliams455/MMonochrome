name: Build MMonochrome MONOSETTINGS1A Leica UI Cleanup
# MONOSETTINGS1A final-head validation trigger

on:
  workflow_dispatch:
  push:
    branches: [research/monosettings1a-leicaui]
    paths:
      - 'apk/mono1a/monosettings1a/**'
      - '.github/workflows/build-mono1a-monosettings1a.yml'

permissions:
  contents: read

concurrency:
  group: mono-settings1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monochrom overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout frozen Android scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1

      - name: Checkout pinned portability tools
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble exact validated MONOTAPMETER1B parent
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apk/mono1a/monosettings1a/*.py
          python3 -u - <<'PY' 2>&1 | tee MONOSETTINGS1A_PARENT.log
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono1a-monotapmeter1a.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0
          count=0
          while i<stop:
              if lines[i].strip()!='run: |':
                  i+=1
                  continue
              i+=1
              block=[]
              while i<stop and not lines[i].startswith('      - name: '):
                  line=lines[i]
                  if line.startswith('          '):
                      block.append(line[10:])
                  elif not line.strip():
                      block.append('')
                  else:
                      raise SystemExit('Unexpected parent boundary '+line)
                  i+=1
              count+=1
              p=Path('/tmp/monosettings-parent-%d.sh'%count)
              p.write_text('\n'.join(block)+'\n')
              subprocess.run(['bash',str(p)],check=True)
          assert count==4,count
          print('MONOTAPMETER1B parent assembly/tests PASS')
          PY

      - name: Apply Monochrom settings policy
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 -u apk/mono1a/monosettings1a/apply.py "$ROOT" 2>&1 | tee MONOSETTINGS1A_APPLY.txt
          python3 -u apk/mono1a/monosettings1a/test.py "$ROOT" 2>&1 | tee MONOSETTINGS1A_TESTS.txt

      - name: Snapshot settings evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/monosettings1a-evidence"
          mkdir -p "$OUT/source"
          cp "$ROOT/MONOSETTINGS1A_ISOLATION.json" "$ROOT/MONOSETTINGS1A_TEST_REPORT.json" "$OUT/"
          cp apk/mono1a/monosettings1a/*.py apk/mono1a/monosettings1a/README.md "$OUT/"
          for f in             app/src/main/res/xml/preferences.xml             app/src/main/java/com/particlesdevs/photoncamera/api/Settings.java             app/src/main/java/com/particlesdevs/photoncamera/ui/camera/viewmodel/SettingsBarEntryProvider.java; do
            mkdir -p "$OUT/source/$(dirname "$f")"
            cp "$ROOT/$f" "$OUT/source/$f"
          done
          printf 'REVISION=MONOSETTINGS1A_LEICA_UI_CLEANUP\nPARENT=MONOTAPMETER1B_LOWKEYREAD1A_INTENTBOUNDARY1A\nVIDEO_VISIBLE=0\nBINNING_CODE_RETAINED=1\nBINNING_VISIBLE=0\nBINNING_RUNTIME=0\nQUADBAYER_CODE_RETAINED=1\nQUADBAYER_VISIBLE=0\nQUADBAYER_RUNTIME=0\nRENDER_CHANGED=0\nDNG_PIXEL_MATH_CHANGED=0\nEXPOSURE_PLACEMENT_CHANGED=0\nCURVE02_CHANGED=0\n' > "$OUT/PROVENANCE.txt"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build MONOSETTINGS1A APK
        shell: bash
        run: |
          set -o pipefail
          cd m9base/PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/MONOSETTINGS1A_GRADLE.log"

      - name: Verify packaged policy marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee MONOSETTINGS1A_APK_PROOF.txt
          from pathlib import Path
          import zipfile,hashlib,json,shutil
          root=Path('m9base/PhotonCamera')
          apks=list((root/'app/build/outputs/apk/debug').glob('*.apk'))
          assert len(apks)==1,apks
          with zipfile.ZipFile(apks[0]) as z:
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              assert b'MONOSETTINGS1A_LEICA_UI_CLEANUP' in dex
              assert b'MONOTAPMETER1A' in dex
          proof=json.loads((root/'MONOSETTINGS1A_ISOLATION.json').read_text())
          for rel,expected in proof['frozenPhotographicHashes'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==expected,rel
          assert not proof['videoSettingsVisible']
          assert proof['quadBayerCodeRetained'] and not proof['quadBayerRuntimeEnabled']
          assert proof['binningCodeRetained'] and not proof['binningRuntimeEnabled']
          out=Path('MMonochrome_MONOSETTINGS1A_LEICA_UI_CLEANUP.apk')
          shutil.copyfile(apks[0],out)
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('MONOSETTINGS1A_APK_SHA256.txt').write_text(digest+'  '+out.name+'\n')
          print('PASS MONOSETTINGS1A package',digest,out.stat().st_size)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOSETTINGS1A-LEICA-UI-CLEANUP-EVIDENCE
          path: |
            MONOSETTINGS1A_*.log
            MONOSETTINGS1A_*.txt
            monosettings1a-evidence/
          if-no-files-found: warn

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOSETTINGS1A-LEICA-UI-CLEANUP
          path: |
            MMonochrome_MONOSETTINGS1A_LEICA_UI_CLEANUP.apk
            MONOSETTINGS1A_APK_SHA256.txt
            MONOSETTINGS1A_APK_PROOF.txt
            monosettings1a-evidence/PROVENANCE.txt
          if-no-files-found: error
