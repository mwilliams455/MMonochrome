name: Build MMonochrome MONOOUTPUT1A Linear DNG
on:
  workflow_dispatch:
  push:
    branches: [research/monooutput1a-linear-dng]
    paths:
      - 'apk/mono1a/monooutput1a/**'
      - '.github/workflows/build-mono1a-monooutput1a.yml'
permissions:
  contents: read
concurrency:
  group: mono-output1a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monochrom overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout frozen Android scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1
      - name: Checkout pinned portability tools
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Replay GL2A assembly and all parent host tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apk/mono1a/monooutput1a/*.py
          python3 -u - <<'PY' | tee MONOOUTPUT1A_PARENT.log
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono1a-monolivegl2a.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0; count=0; name=''
          while i<stop:
              line=lines[i]
              if line.startswith('      - name: '): name=line.split(': ',1)[1]
              if line.strip()!='run: |': i+=1; continue
              i+=1; block=[]
              while i<stop:
                  line=lines[i]
                  if line.startswith('      - name: '): break
                  if line.startswith('          '): block.append(line[10:])
                  elif not line.strip(): block.append('')
                  else: raise SystemExit('Unexpected parent boundary: '+line)
                  i+=1
              count+=1; script=Path('/tmp/monooutput-parent-%02d.sh'%count)
              script.write_text('\n'.join(block)+'\n')
              print('PARENT: '+name,flush=True)
              subprocess.run(['bash',str(script)],check=True)
          assert count==5,count
          print('GL2A full assembly replay and host tests PASS')
          PY
      - name: Apply output cleanup and read-only luminance export
        shell: bash
        run: |
          set -euo pipefail
          python3 apk/mono1a/monooutput1a/apply.py "$GITHUB_WORKSPACE/m9base/PhotonCamera" | tee MONOOUTPUT1A_APPLY.txt
      - name: Validate DNG with TIFF and RAW readers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y libimage-exiftool-perl python3-venv
          python3 -m venv /tmp/monooutput-reader-env
          /tmp/monooutput-reader-env/bin/pip install numpy tifffile rawpy
          /tmp/monooutput-reader-env/bin/python apk/mono1a/monooutput1a/test_export.py "$GITHUB_WORKSPACE/m9base/PhotonCamera" | tee MONOOUTPUT1A_READERS.log
      - name: Snapshot changed source and frozen contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil,hashlib
          root=Path('m9base/PhotonCamera');out=Path('monooutput1a-evidence');out.mkdir(exist_ok=True)
          proof=json.loads((root/'MONOOUTPUT1A_ISOLATION.json').read_text())
          for rel,h in proof['frozenFiles'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==h,rel
              shutil.copyfile(root/rel,out/Path(rel).name)
          shutil.copyfile(root/'app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java',out/'M9R35Renderer.java')
          for name in ['MonoLinearPlane1A.java','MonoDngWriter1A.java','MonoDngExport1A.java']:
              shutil.copyfile(root/'app/src/main/java/com/particlesdevs/photoncamera/m9/export'/name,out/name)
          for p in Path('apk/mono1a/monooutput1a').iterdir():
              if p.is_file():shutil.copyfile(p,out/('overlay-'+p.name))
          for name in ['MONOOUTPUT1A_ISOLATION.json','MONOOUTPUT1A_EXPORT_TEST.json']:
              shutil.copyfile(root/name,out/name)
          shutil.copyfile(root/'app/build.gradle',out/'app-build.gradle')
          fixtures=root/'monooutput1a-fixtures'
          for name in ['fixtures.json','SYNTHETIC_12.dng','SYNTHETIC_12.u16']:
              shutil.copyfile(fixtures/name,out/name)
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt'))
          PY
          printf 'REVISION=MONOOUTPUT1A_LINEAR_DNG\nCOMMIT=%s\nCOMPARISON_JPEGS_DEFAULT=OFF\nORIGINAL_RAW_RETAINED=1\nGL2A_VISUAL_CHANGED=0\nPRIMARY_NATIVE_ARITHMETIC_CHANGED=0\nPHONE_EXPORT_VALIDATED=0\nLIGHTROOM_VALIDATED=0\n' "$GITHUB_SHA" > monooutput1a-evidence/PROVENANCE.txt
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Build MONOOUTPUT1A APK
        shell: bash
        run: |
          set -o pipefail
          cd m9base/PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/MONOOUTPUT1A_GRADLE.log"
      - name: Verify packaged visual identity and export markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee MONOOUTPUT1A_APK_PROOF.txt
          from pathlib import Path
          import zipfile,hashlib,shutil,json
          root=Path('m9base/PhotonCamera');proof=json.loads((root/'MONOOUTPUT1A_ISOLATION.json').read_text())
          apks=list((root/'app/build/outputs/apk/debug').glob('*.apk'));assert len(apks)==1
          with zipfile.ZipFile(apks[0]) as z:
              for rel in ['assets/shaders/preview/main_fs.glsl','assets/mono/mono_curve02_gl2a.bin']:
                  assert hashlib.sha256(z.read(rel)).hexdigest()==proof['frozenFiles']['app/src/main/'+rel],rel
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for marker in [b'MONOOUTPUT1A_LINEAR_DNG',b'_MONO_LINEAR1A.dng',b'MONOLIVEGL2A_CONTROLLEDOES',b'originalRawRetained',b'monochrome_dng_export']:
                  assert marker in dex,marker
          out=Path('MMonochrome_MONOOUTPUT1A_LINEAR_DNG.apk');shutil.copyfile(apks[0],out)
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('MONOOUTPUT1A_APK_SHA256.txt').write_text(digest+'  '+out.name+'\n')
          print('PASS packaged GL2A shader/curve unchanged and derived DNG markers present')
          print(digest,out.stat().st_size)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOOUTPUT1A-EVIDENCE
          path: |
            MONOOUTPUT1A_*.log
            MONOOUTPUT1A_*.txt
            MONOLIVEGL2A_MATH.txt
            MONOLIVEGL2A_STATE.txt
            MONOLIVEGL2A_GPU.json
            m9base/PhotonCamera/MONOOUTPUT1A_*.json
            monooutput1a-evidence/
          if-no-files-found: warn
      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOOUTPUT1A-LINEAR-DNG
          path: |
            MMonochrome_MONOOUTPUT1A_LINEAR_DNG.apk
            MONOOUTPUT1A_APK_SHA256.txt
            MONOOUTPUT1A_APK_PROOF.txt
            monooutput1a-evidence/PROVENANCE.txt
          if-no-files-found: error
