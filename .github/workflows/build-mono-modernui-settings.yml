name: Build MMonochrome Modern Photon UI
on:
  workflow_dispatch:
  push:
    branches: [research/mono-upstream1b-modernui-settings]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore validated modern Photon Monochrom source
        run: python3 apk/mono1a/upstream1a/assemble.py PhotonCamera
      - name: Apply current Leica settings cleanup
        run: |
          python3 apk/mono1a/monosettings1a/apply.py PhotonCamera
          python3 apk/mono1a/monosettings1a/test.py PhotonCamera
          python3 apk/mono1a/monosettings1b/apply.py PhotonCamera
          python3 apk/mono1a/monosettings1b/test.py PhotonCamera
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Build
        run: |
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Package
        run: |
          cp PhotonCamera/app/build/outputs/apk/debug/*.apk MMonochrome_MODERNUI_SETTINGS.apk
          sha256sum MMonochrome_MODERNUI_SETTINGS.apk > MMonochrome_MODERNUI_SETTINGS.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MODERNUI-SETTINGS
          path: |
            MMonochrome_MODERNUI_SETTINGS.apk
            MMonochrome_MODERNUI_SETTINGS.sha256
