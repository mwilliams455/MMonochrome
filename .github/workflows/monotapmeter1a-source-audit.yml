name: MMonochrome MONOTAPMETER1A Source Audit

on:
  workflow_dispatch:
  push:
    branches: [research/monotapmeter1a]
    paths:
      - '.github/workflows/monotapmeter1a-source-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Monochrom overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout frozen Android scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1
      - name: Checkout pinned portability tools
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install parent validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'numpy==2.3.5' 'tifffile==2026.5.15'
      - name: Assemble exact validated 1H source
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY' 2>&1 | tee MONOTAP_SOURCE_PARENT.log
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono1a-monoauto1d1g.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0;count=0
          while i<stop:
              if lines[i].strip()!='run: |':
                  i+=1;continue
              i+=1;block=[]
              while i<stop and not lines[i].startswith('      - name: '):
                  line=lines[i]
                  if line.startswith('          '): block.append(line[10:])
                  elif not line.strip(): block.append('')
                  else: raise SystemExit('Unexpected parent boundary '+line)
                  i+=1
              count+=1
              p=Path('/tmp/monotap-parent-%d.sh'%count)
              p.write_text('\n'.join(block)+'\n')
              subprocess.run(['bash',str(p)],check=True)
          assert count==3,count
          print('1G parent assembly/tests PASS')
          PY
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 -u apk/mono1a/monoauto1d1h/apply.py "$ROOT" | tee MONOTAP_SOURCE_1H_APPLY.txt
          python3 -u apk/mono1a/monoauto1d1h/test.py "$ROOT" | tee MONOTAP_SOURCE_1H_TESTS.txt
      - name: Export exact assembled tap-relevant sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          OUT="$GITHUB_WORKSPACE/MONOTAP_1H_SOURCE"
          mkdir -p "$OUT"
          files=(
            app/src/main/java/com/particlesdevs/photoncamera/control/Swipe.java
            app/src/main/java/com/particlesdevs/photoncamera/control/TouchFocus.java
            app/src/main/java/com/particlesdevs/photoncamera/ui/camera/CameraFragment.java
            app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/GLPreview.java
            app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/MainRenderer.java
            app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/viewfinder/SurfaceViewOverViewfinder.java
            app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java
            app/src/main/java/com/particlesdevs/photoncamera/capture/CaptureController.java
            app/src/main/java/com/particlesdevs/photoncamera/m9/M9M10rMfmTest1A.java
            app/src/main/java/com/particlesdevs/photoncamera/m9/exposure/MonoExposurePlan1A.java
            app/src/main/java/com/particlesdevs/photoncamera/m9/exposure/MonoExposureStore1A.java
            app/src/main/java/com/particlesdevs/photoncamera/m9/exposure/MonoExposureDiagnostics1A.java
            app/src/main/java/com/particlesdevs/photoncamera/m9/exposure/MonoPlacementAssist1D.java
            app/src/main/java/com/particlesdevs/photoncamera/m9/preview/MonoGpuPreview2A.java
            app/build.gradle
          )
          for f in "${files[@]}"; do
            test -f "$ROOT/$f"
            mkdir -p "$OUT/$(dirname "$f")"
            cp "$ROOT/$f" "$OUT/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('MONOTAP_1H_SOURCE')
          data={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          Path('MONOTAP_1H_SOURCE_MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
          print('exported',len(data),'files')
          PY
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOTAPMETER1A-1H-SOURCE-AUDIT
          path: |
            MONOTAP_1H_SOURCE/
            MONOTAP_1H_SOURCE_MANIFEST.json
            MONOTAP_SOURCE_*.log
            MONOTAP_SOURCE_*.txt
          if-no-files-found: error
