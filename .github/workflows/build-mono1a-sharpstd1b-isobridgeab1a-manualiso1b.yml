name: Build MMonochrom SHARPSTD1B ISO Bridge A/B MANUALISO1B

on:
  workflow_dispatch:
  push:
    branches:
      - apk/mono1a-rawscalar1b-sharpstd1b-isobridgeab1a-manualiso1b
    paths:
      - 'apk/mono1a/**'
      - 'tools/generate_mm_standard_sharp_header.py'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/pwad.py'
      - '.github/workflows/build-mono1a-sharpstd1b-isobridgeab1a-manualiso1b.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout MMonochrome overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout frozen M9 Android scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1

      - name: Verify overlay scripts
        run: |
          set -euo pipefail
          test "$(git -C m9base rev-parse HEAD)" = "fb1db92ef78df70442b9fee879795e584f2170cf"
          python3 -m py_compile \
            apk/mono1a/apply-mono1a.py \
            apk/mono1a/apply-source1d.py \
            apk/mono1a/apply-rawscalar1a.py \
            apk/mono1a/apply-rawscalar1b.py \
            apk/mono1a/promote-rawscalar1b.py \
            apk/mono1a/apply-sharpstd1a.py \
            apk/mono1a/apply-sharpstd1b-isobridgeab1a.py \
            apk/mono1a/apply-manualiso-physical1a.py \
            apk/mono1a/apply-manualiso-preserve1b.py
          python3 -m py_compile tools/generate_mm_standard_sharp_header.py tools/recover_leica_m9_mm_shared_key.py tools/pwad.py
          cat > MANUALISO1B_UPSTREAM.txt <<'EOF'
          M9_ANDROID_BASE=fb1db92ef78df70442b9fee879795e584f2170cf
          MANUALISO1A_PARENT=a41097f3186b48f3e4ab9bb26a094d8196acfef4
          MM_CURVE02_SHA256=7a7ccd9021cf9881384b733236fe249d2088358705d8db282687e943aa990752
          MM_SHARP_BANK_SHA256=282a6e7eb0603203d5ddb36f32862e0340a9cc2d24c35b4c0af2b1bd79c06d10
          SOURCE_REVISION=MONO1A_RAWSCALAR1B_SHARPSTD1B_ISOBRIDGEAB1A_MANUALISO1B_PRESERVE1A
          BASELINE_POLICY=RAWSCALAR1B_PROMOTED1A_PRIMARY_UNCHANGED
          PHYSICAL_SHARP_POLICY=SHARPSTD1A_UNCHANGED
          NORMISO_POLICY=PHOTON_ISO100_RECONSTRUCTED_FROM_CAPTURE_ISO_AND_SENSOR_ISO_LOW
          MANUAL_ISO_UI_POLICY=PHYSICAL_SENSOR_ISO_RANGE_AND_VALUES
          MANUAL_ISO_PANEL_POLICY=COLLAPSE_PRESERVES_SELECTED_MANUAL_VALUES
          MANUAL_ISO_TRACE=UI_TO_PARAMCONTROLLER_TO_GENERATEEXPOPAIR
          PHOTON_INTERNAL_ISO100_NORMALIZATION=UNCHANGED
          EOF

      - name: Verify frozen M9 patch syntax
        working-directory: m9base
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m9cam-basishsm1p-demosaicmhc1a.py patches/fix-m9cam-basishsm1p-demosaicmhc1a-lifetime1a.py patches/verify-m9cam-basishsm1p-demosaicmhc1a.py
          python3 -m py_compile patches/apply-m9cam-basishsm1p-demosaicab1a.py patches/verify-m9cam-basishsm1p-demosaicab1a.py patches/apply-m9cam-basishsm1p-demosaicmhcneutral1a.py patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a.py
          python3 -m py_compile patches/promote-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py

      - name: Replay exact frozen M9 parent assembly
        working-directory: m9base
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_WORKSPACE="$PWD"
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/build-m9cam-basishsm1p-curvedomain1c-upstreamaxis1a.yml')
          lines=wf.read_text().splitlines()
          names=['Replay exact CURVEDOMAIN1B parent assembly','Apply CURVEDOMAIN1C UPSTREAMAXIS1A read-only extension']
          for idx,name in enumerate(names):
              target='      - name: '+name
              i=lines.index(target)
              while i<len(lines) and lines[i].strip()!='run: |': i+=1
              if i>=len(lines): raise SystemExit('parent run block missing: '+name)
              i+=1
              out=[]
              while i<len(lines):
                  line=lines[i]
                  if line.startswith('      - name:'): break
                  if line.startswith('          '): out.append(line[10:])
                  elif not line.strip(): out.append('')
                  else: raise SystemExit('unexpected parent indentation: '+line)
                  i+=1
              Path(f'/tmp/mono_manualiso_parent_{idx}.sh').write_text('\n'.join(out)+'\n')
          PY
          for s in /tmp/mono_manualiso_parent_*.sh; do bash "$s"; done

      - name: Apply validated frozen MHC demosaic chain
        working-directory: m9base
        run: |
          set -euxo pipefail
          ROOT="$PWD/PhotonCamera"
          python3 patches/apply-m9cam-basishsm1p-demosaicmhc1a.py "$ROOT"
          python3 patches/fix-m9cam-basishsm1p-demosaicmhc1a-lifetime1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhc1a.py "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-demosaicab1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicab1a.py "$ROOT"
          python3 patches/apply-m9cam-basishsm1p-demosaicmhcneutral1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a.py "$ROOT"
          python3 patches/promote-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py "$ROOT"
          python3 patches/verify-m9cam-basishsm1p-demosaicmhcneutral1a-frozen1a.py "$ROOT"

      - name: Apply validated M Monochrom RAWSCALAR1B baseline
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 apk/mono1a/apply-mono1a.py "$ROOT"
          python3 apk/mono1a/apply-source1d.py "$ROOT"
          python3 apk/mono1a/apply-rawscalar1a.py "$ROOT"
          python3 apk/mono1a/apply-rawscalar1b.py "$ROOT"
          python3 apk/mono1a/promote-rawscalar1b.py "$ROOT"

      - name: Generate canonical Standard sharpness LUT header
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          mkdir -p "$RUNNER_TEMP/mmsharp"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmsharp/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmsharp/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py "$RUNNER_TEMP/mmsharp/m9.upd" "$RUNNER_TEMP/mmsharp/mm.upm" --mm-out "$RUNNER_TEMP/mmsharp/mm.dec" --meta-out "$RUNNER_TEMP/mmsharp/recovery_meta.json"
          python3 tools/generate_mm_standard_sharp_header.py "$RUNNER_TEMP/mmsharp/mm.dec" --out "$ROOT/app/src/main/cpp/mm_monochrom_standard_sharp_lut.inc" | tee MANUALISO1B_LUT_GENERATION.txt
          grep -q 'bank_sha256=282a6e7eb0603203d5ddb36f32862e0340a9cc2d24c35b4c0af2b1bd79c06d10' MANUALISO1B_LUT_GENERATION.txt
          rm -f "$RUNNER_TEMP/mmsharp/m9.upd" "$RUNNER_TEMP/mmsharp/mm.upm" "$RUNNER_TEMP/mmsharp/mm.dec"

      - name: Apply sharpness bridge and manual ISO fixes
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 apk/mono1a/apply-sharpstd1a.py "$ROOT"
          python3 apk/mono1a/apply-sharpstd1b-isobridgeab1a.py "$ROOT"
          python3 apk/mono1a/apply-manualiso-physical1a.py "$ROOT"
          python3 apk/mono1a/apply-manualiso-preserve1b.py "$ROOT"

      - name: Verify MANUALISO1B and frozen photographic path
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          R="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java"
          H="$ROOT/app/src/main/cpp/mm_monochrom_standard_sharp_lut.inc"
          P="$ROOT/circularbarlib/src/main/java/com/particlesdevs/photoncamera/circularbarlib/camera/CameraProperties.java"
          I="$ROOT/circularbarlib/src/main/java/com/particlesdevs/photoncamera/circularbarlib/control/models/IsoModel.java"
          MC="$ROOT/circularbarlib/src/main/java/com/particlesdevs/photoncamera/circularbarlib/console/ManualModeConsoleImpl.java"
          S="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/control/Swipe.java"
          E="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java"
          PC="$ROOT/app/src/main/java/com/particlesdevs/photoncamera/manual/ParamController.java"
          grep -n 'monochromPrimarySource.*RAWSCALAR1B_FIXED_D65' "$R"
          grep -n 'MM_MONO_STD_SHARP_BORDER = 2' "$H"
          grep -n 'MM_MONO_STD_SHARP_CODES\[16\].*8,8,8,8,4,4,4,4,4,4,4,4,3,3,2,2' "$H"
          grep -n 'MANUALISO1A_PHYSICAL_RANGE' "$P"
          grep -n 'MANUALISO1A_PHYSICAL_VALUE' "$I"
          grep -n 'MANUALISO1B_TRACE_SELECTED' "$I"
          grep -n 'MANUALISO1B_PRESERVE_PANEL' "$MC"
          grep -n 'MANUALISO1B_PRESERVE_KNOBS' "$MC"
          grep -n 'MANUALISO1B_PRESERVE_SWIPE' "$S"
          grep -n 'captureController.getParamController().setupPreview();' "$S"
          grep -n 'MANUALISO1B_TRACE_PARAM' "$PC"
          grep -n 'MANUALISO1B_TRACE_ALLOCATOR' "$E"
          grep -n 'pair.iso = (int) (currentManISO \* 100.0 / pair.isolow);' "$E"
          ! grep -q 'manualParamModel.reset();' "$MC" || true

      - name: Snapshot assembled source
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          mkdir -p manualiso1b-assembled-source
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java" manualiso1b-assembled-source/
          cp "$ROOT/app/src/main/cpp/m9color_jni.cpp" manualiso1b-assembled-source/
          cp "$ROOT/app/src/main/cpp/mm_monochrom_standard_sharp_lut.inc" manualiso1b-assembled-source/
          cp "$ROOT/circularbarlib/src/main/java/com/particlesdevs/photoncamera/circularbarlib/camera/CameraProperties.java" manualiso1b-assembled-source/
          cp "$ROOT/circularbarlib/src/main/java/com/particlesdevs/photoncamera/circularbarlib/control/models/IsoModel.java" manualiso1b-assembled-source/
          cp "$ROOT/circularbarlib/src/main/java/com/particlesdevs/photoncamera/circularbarlib/console/ManualModeConsoleImpl.java" manualiso1b-assembled-source/
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/control/Swipe.java" manualiso1b-assembled-source/
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java" manualiso1b-assembled-source/ProcessingIsoExpoSelector.java
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/manual/ParamController.java" manualiso1b-assembled-source/
          cp MANUALISO1B_UPSTREAM.txt MANUALISO1B_LUT_GENERATION.txt manualiso1b-assembled-source/
          sha256sum manualiso1b-assembled-source/* | tee manualiso1b-assembled-source/SHA256SUMS.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build MANUALISO1B debug APK
        shell: bash
        run: |
          set -o pipefail
          cd m9base/PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/MANUALISO1B_GRADLE.log"

      - name: Record APK SHA256
        if: success()
        run: sha256sum m9base/PhotonCamera/app/build/outputs/apk/debug/*.apk | tee MANUALISO1B_APK_SHA256.txt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-MANUALISO1B-BUILDLOG
          path: MANUALISO1B_GRADLE.log
          if-no-files-found: ignore

      - name: Upload assembled source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-MANUALISO1B-ASSEMBLED-SOURCE
          path: manualiso1b-assembled-source/
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-RAWSCALAR1B-SHARPSTD1B-ISOBRIDGEAB1A-MANUALISO1B
          path: |
            m9base/PhotonCamera/app/build/outputs/apk/debug/*.apk
            MANUALISO1B_APK_SHA256.txt
            MANUALISO1B_UPSTREAM.txt
          if-no-files-found: error
