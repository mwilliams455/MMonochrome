name: M Monochrom Noise Matrix Scan

on:
  workflow_dispatch:
  push:
    branches:
      - research/mm-sharpness-lutbank1a
    paths:
      - '.github/workflows/mm-noise-matrix-scan.yml'
      - 'tools/mm_noise_matrix_scan.py'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/pwad.py'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/mm_noise_matrix_scan.py tools/recover_leica_m9_mm_shared_key.py tools/pwad.py
      - name: Download and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmnscan"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmnscan/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmnscan/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py "$RUNNER_TEMP/mmnscan/m9.upd" "$RUNNER_TEMP/mmnscan/mm.upm" --mm-out "$RUNNER_TEMP/mmnscan/mm.dec" --meta-out "$RUNNER_TEMP/mmnscan/recovery_meta.json"
      - name: Scan matrix candidates
        run: python3 tools/mm_noise_matrix_scan.py "$RUNNER_TEMP/mmnscan/mm.dec" --out "$RUNNER_TEMP/mmnscan/MM_NOISE_MATRIX_SCAN.json"
      - uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-NOISE-MATRIX-SCAN1A
          retention-days: 30
          path: |
            ${{ runner.temp }}/mmnscan/recovery_meta.json
            ${{ runner.temp }}/mmnscan/MM_NOISE_MATRIX_SCAN.json
      - if: always()
        run: rm -rf "$RUNNER_TEMP/mmnscan/m9.upd" "$RUNNER_TEMP/mmnscan/mm.upm" "$RUNNER_TEMP/mmnscan/mm.dec"
