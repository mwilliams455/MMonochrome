name: M Monochrom BF547 Process Mask Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/mm-sharpness-lutbank1a
    paths:
      - '.github/workflows/mm-bf547-process-mask-probe.yml'
      - 'tools/mm_bf547_process_mask_probe.py'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/pwad.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts
        run: |
          set -euo pipefail
          python3 -m py_compile tools/mm_bf547_process_mask_probe.py tools/recover_leica_m9_mm_shared_key.py tools/pwad.py
      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          "$OBJDUMP" -i | grep -Eiq 'bfin|blackfin'
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
      - name: Download and decrypt canonical firmware pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmbf547mask"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmbf547mask/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmbf547mask/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py "$RUNNER_TEMP/mmbf547mask/m9.upd" "$RUNNER_TEMP/mmbf547mask/mm.upm" --m9-out "$RUNNER_TEMP/mmbf547mask/m9.dec" --mm-out "$RUNNER_TEMP/mmbf547mask/mm.dec" --meta-out "$RUNNER_TEMP/mmbf547mask/recovery_meta.json"
      - name: Compare BF547 process-mask source
        run: |
          set -euo pipefail
          python3 tools/mm_bf547_process_mask_probe.py "$RUNNER_TEMP/mmbf547mask/m9.dec" "$RUNNER_TEMP/mmbf547mask/mm.dec" --objdump "$OBJDUMP" --outdir "$RUNNER_TEMP/mmbf547mask/derived"
          cat "$RUNNER_TEMP/mmbf547mask/derived/MM_BF547_PROCESS_MASK_PROBE.txt"
      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-BF547-PROCESS-MASK1A
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mmbf547mask/recovery_meta.json
            ${{ runner.temp }}/mmbf547mask/derived/MM_BF547_PROCESS_MASK_PROBE.json
            ${{ runner.temp }}/mmbf547mask/derived/MM_BF547_PROCESS_MASK_PROBE.txt
      - name: Remove firmware material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmbf547mask/m9.upd" "$RUNNER_TEMP/mmbf547mask/mm.upm" "$RUNNER_TEMP/mmbf547mask/m9.dec" "$RUNNER_TEMP/mmbf547mask/mm.dec"
