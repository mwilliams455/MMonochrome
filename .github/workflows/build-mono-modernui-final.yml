name: Build MMonochrome Modern UI + Leica Settings

on:
  workflow_dispatch:
  push:
    branches: [research/mono-upstream1b-modernui-settings]
    paths:
      - 'apk/mono1a/upstream1a/modified_patch_parts/**'
      - 'apk/mono1a/upstream1a/modern_new_files.txt'
      - 'apk/mono1a/monosettings1a/**'
      - 'apk/mono1a/monosettings1b/**'
      - '.github/workflows/build-mono-modernui-final.yml'

permissions:
  contents: read

concurrency:
  group: mono-modernui-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monochrom overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout frozen Monochrom reconstruction scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1

      - name: Checkout pinned portability tools
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct validated MONOTAPMETER1B source donor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apk/mono1a/monosettings1a/*.py apk/mono1a/monosettings1b/*.py
          python3 -u - <<'PY' 2>&1 | tee MODERNUI_PARENT.log
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono1a-monotapmeter1a.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0;count=0
          while i<stop:
              if lines[i].strip()!='run: |':
                  i+=1;continue
              i+=1;block=[]
              while i<stop and not lines[i].startswith('      - name: '):
                  line=lines[i]
                  if line.startswith('          '): block.append(line[10:])
                  elif not line.strip(): block.append('')
                  else: raise SystemExit('Unexpected parent boundary '+line)
                  i+=1
              count+=1
              p=Path('/tmp/mono-modern-parent-%d.sh'%count)
              p.write_text('\n'.join(block)+'\n')
              subprocess.run(['bash',str(p)],check=True)
          assert count==4,count
          print('MONOTAPMETER1B donor reconstruction PASS')
          PY

      - name: Restore exact validated modern integration patch
        shell: bash
        run: |
          set -euo pipefail
          cat apk/mono1a/upstream1a/modified_patch_parts/part*.b64 > MODERN_INTEGRATION.b64
          test "$(wc -c < MODERN_INTEGRATION.b64)" = "43180"
          base64 -d MODERN_INTEGRATION.b64 > MODERN_INTEGRATION.patch.gz
          echo "17b67c0e7a755e39d2024045472de7942c0f8b2f028a8b8d5f16e2e635edd130  MODERN_INTEGRATION.patch.gz" | sha256sum -c -
          gzip -dc MODERN_INTEGRATION.patch.gz > MODERN_INTEGRATION.patch
          test "$(grep -c '^diff --git ' MODERN_INTEGRATION.patch)" = "29"
          grep -q 'MONOUPSTREAM1A_RAW16' MODERN_INTEGRATION.patch
          grep -q 'MONO_DEVICEPORT3A_RAWSTRIDE_PACK1A' MODERN_INTEGRATION.patch
          sha256sum MODERN_INTEGRATION.patch.gz | tee MODERN_INTEGRATION_SHA256.txt

      - name: Checkout modern Photon base
        uses: actions/checkout@v4
        with:
          repository: eszdman/PhotonCamera
          ref: 4ee108e169496f429c0afa0cc33e57bb6b2ec724
          path: PhotonModern
          fetch-depth: 1

      - name: Add current Monochrom-only production files
        shell: bash
        run: |
          set -euo pipefail
          DONOR="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          DEST="$GITHUB_WORKSPACE/PhotonModern"
          count=0
          while IFS= read -r f; do
            test -n "$f" || continue
            test -f "$DONOR/$f" || { echo "Missing donor file $f"; exit 1; }
            test ! -e "$DEST/$f" || { echo "Expected Monochrom-only path already exists in modern Photon: $f"; exit 1; }
            mkdir -p "$DEST/$(dirname "$f")"
            cp "$DONOR/$f" "$DEST/$f"
            count=$((count+1))
          done < apk/mono1a/upstream1a/modern_new_files.txt
          test "$count" = "67"
          echo "MONO_ONLY_FILE_COUNT=$count" | tee MODERNUI_COPY_PROOF.txt

      - name: Apply phone-validated UPSTREAM1A RAW16 integration
        shell: bash
        run: |
          set -euo pipefail
          git -C PhotonModern apply --check --binary --whitespace=nowarn "$GITHUB_WORKSPACE/MODERN_INTEGRATION.patch"
          git -C PhotonModern apply --binary --whitespace=nowarn "$GITHUB_WORKSPACE/MODERN_INTEGRATION.patch"
          ! grep -R -n '^<<<<<<<\|^=======\|^>>>>>>>' PhotonModern/app PhotonModern/circularbarlib
          grep -q 'MONOUPSTREAM1A_RAW16' PhotonModern/app/build.gradle
          grep -q 'MONO_DEVICEPORT3A_RAWSTRIDE_PACK1A' PhotonModern/app/src/main/java/com/particlesdevs/photoncamera/processing/ImageSaver.java

      - name: Verify modern Photon UI authority before Leica cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f PhotonModern/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/LensZoomBarController.java
          test -f PhotonModern/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/settingsbar/SettingsBarLayout.java
          grep -q 'settings_button' PhotonModern/app/src/main/res/layout/layout_main_topbar.xml
          grep -q 'SettingsBarEntryProvider' PhotonModern/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/viewmodel/SettingsBarEntryProvider.java
          grep -q 'pref_category_video_shortcut_key' PhotonModern/app/src/main/res/xml/preferences.xml
          printf 'PHOTON_BASE=4ee108e169496f429c0afa0cc33e57bb6b2ec724\nMODERN_UI_AUTHORITY=PHOTON_DEV\nUPSTREAM1A_RAW16=1\n' > MODERNUI_BASE_PROOF.txt

      - name: Apply Leica Monochrom settings cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 -u apk/mono1a/monosettings1a/apply.py PhotonModern 2>&1 | tee MODERNUI_SETTINGS1A_APPLY.txt
          python3 -u apk/mono1a/monosettings1a/test.py PhotonModern 2>&1 | tee MODERNUI_SETTINGS1A_TEST.txt
          python3 -u apk/mono1a/monosettings1b/apply.py PhotonModern 2>&1 | tee MODERNUI_SETTINGS1B_APPLY.txt
          python3 -u apk/mono1a/monosettings1b/test.py PhotonModern 2>&1 | tee MODERNUI_SETTINGS1B_TEST.txt

      - name: Verify final modern UI and Monochrom seams
        shell: bash
        run: |
          set -euo pipefail
          grep -A18 'android:id="@+id/settings_button"' PhotonModern/app/src/main/res/layout/layout_main_topbar.xml | grep -q 'android:visibility="visible"'
          grep -A18 'android:id="@+id/settings_button"' PhotonModern/app/src/main/res/layout/layout_main_topbar.xml | grep -q 'app:layout_constraintStart_toEndOf="@id/flash_button"'
          grep -q 'class LensZoomBarController' PhotonModern/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/views/LensZoomBarController.java
          grep -q 'MONOTAPMETER1A' PhotonModern/app/src/main/java/com/particlesdevs/photoncamera/m9/preview/MonoTapMeter1A.java
          grep -q 'MONOOUTPUT1E_BASELINE_IFD0' PhotonModern/app/src/main/java/com/particlesdevs/photoncamera/m9/export/MonoDngWriter1A.java
          grep -q '7a7ccd9021cf9881384b733236fe249d2088358705d8db282687e943aa990752' PhotonModern/app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java
          ! grep -q '@string/pref_category_video_shortcut_key' PhotonModern/app/src/main/res/xml/preferences.xml
          printf 'REVISION=MONOUPSTREAM1B_MODERNUI_SETTINGS\nPHOTON_BASE=4ee108e169496f429c0afa0cc33e57bb6b2ec724\nMODERN_UI=1\nVIDEO_SETTINGS_VISIBLE=0\nQUAD_VISIBLE=0\nBINNING_VISIBLE=0\nSETTINGS_RIGHT_OF_FLASH=1\nRAW16_FIX=1\n' > MODERNUI_FINAL_PROOF.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build modern UI Monochrom APK
        shell: bash
        run: |
          set -o pipefail
          cd PhotonModern
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/MODERNUI_GRADLE.log"

      - name: Package and verify APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee MODERNUI_APK_PROOF.txt
          from pathlib import Path
          import hashlib,shutil,zipfile
          root=Path('PhotonModern')
          apks=list((root/'app/build/outputs/apk/debug').glob('*.apk'))
          assert len(apks)==1,apks
          out=Path('MMonochrome_MODERNUI_UPSTREAM1B_SETTINGS.apk')
          shutil.copyfile(apks[0],out)
          with zipfile.ZipFile(out) as z:
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for marker in [b'MONOTAPMETER1A',b'MONOOUTPUT1E_BASELINE_IFD0',b'MONO_SETTINGS_POLICY_REVISION']:
                  assert marker in dex,marker
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('MMonochrome_MODERNUI_UPSTREAM1B_SETTINGS.sha256').write_text(digest+'  '+out.name+'\n')
          print('PASS',out.name,out.stat().st_size,digest)
          PY

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MODERNUI-UPSTREAM1B-EVIDENCE
          path: |
            MODERN_INTEGRATION_SHA256.txt
            MODERNUI_*PROOF.txt
            MODERNUI_*.log
            MODERNUI_*_TEST.txt
            MODERNUI_*_APPLY.txt
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MODERNUI-UPSTREAM1B-SETTINGS
          path: |
            MMonochrome_MODERNUI_UPSTREAM1B_SETTINGS.apk
            MMonochrome_MODERNUI_UPSTREAM1B_SETTINGS.sha256
            MODERNUI_FINAL_PROOF.txt
          if-no-files-found: error
