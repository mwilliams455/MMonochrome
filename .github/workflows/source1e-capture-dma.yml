name: SOURCE1E Capture DMA Trace

on:
  workflow_dispatch:
  push:
    branches:
      - research/source1e-processy
    paths:
      - '.github/workflows/source1e-capture-dma.yml'
      - 'tools/recover_m9_mm_shared_key.py'
      - 'tools/pwad.py'
      - 'tools/extract_source1e_targets.py'
      - 'tools/resolve_bfin_calls.py'

permissions:
  contents: read

jobs:
  capture-dma:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install or build GNU Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential jq
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"

      - name: Download and decrypt canonical Monochrom firmware
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/source1e-capturedma"
          mkdir -p "$W/evidence" "$W/extracted" "$W/functions"
          curl --fail --location --retry 4 --retry-all-errors -o "$W/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$W/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo 'c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  '"$W/m9.upd" | sha256sum -c --strict
          echo '53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  '"$W/mm.upm" | sha256sum -c --strict
          python tools/recover_m9_mm_shared_key.py "$W/m9.upd" "$W/mm.upm" \
            --m9-out "$W/m9.dec" --mm-out "$W/mm.dec" --meta-out "$W/evidence/recovery_meta.json"

      - name: Extract Monochrom bf0 assets
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/source1e-capturedma"
          PYTHONPATH=tools python - <<'PY'
          import os
          from pathlib import Path
          from pwad import get_lump
          root = Path(os.environ['RUNNER_TEMP']) / 'source1e-capturedma'
          fw = (root / 'mm.dec').read_bytes()
          for name in ('bf0', 'bf0.map'):
              (root / 'extracted' / f'mm_{name}').write_bytes(get_lump(fw, ['BF561', name]).data)
          PY

      - name: Extract capture DMA lineage targets
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/source1e-capturedma"
          TARGETS=(
            Sensor_InitTransfer Sensor_Enable Sensor_Disable
            PPI_SetupTransfer PPI_SetupTransferLinear PPI_Enable PPI_Disable
            PPI_InitMemory2PPITransf PPI_InitPPITransferForBu
            IP_GenerateReadRequests SPI_SetNextImage SPI_TransferStart
            IM_GetCurrentJob IM_GetRawBuffer
          )
          ARGS=()
          for name in "${TARGETS[@]}"; do ARGS+=(--target "$name"); done
          python tools/extract_source1e_targets.py \
            --mono-ldr "$W/extracted/mm_bf0" --mono-map "$W/extracted/mm_bf0.map" \
            "${ARGS[@]}" --out-dir "$W/functions" --strict > "$W/evidence/capture_dma_anchors.json"
          cat "$W/evidence/capture_dma_anchors.json"

      - name: Disassemble capture DMA lineage
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/source1e-capturedma"
          E="$W/evidence"
          A="$E/capture_dma_anchors.json"
          TARGETS='Sensor_InitTransfer Sensor_Enable Sensor_Disable PPI_SetupTransfer PPI_SetupTransferLinear PPI_Enable PPI_Disable PPI_InitMemory2PPITransf PPI_InitPPITransferForBu IP_GenerateReadRequests SPI_SetNextImage SPI_TransferStart IM_GetCurrentJob IM_GetRawBuffer'
          for name in $TARGETS; do
            file="$W/functions/mm_${name}.bin"
            base=$(jq -r --arg n "$name" '.targets[$n].monochrom.address' "$A")
            "$OBJDUMP" -D -b binary -m bfin --adjust-vma="$base" "$file" > "$E/mm_${name}.gnu.dis.txt"
          done

      - name: Resolve direct calls and capture-address writes
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/source1e-capturedma"
          E="$W/evidence"
          ARGS=()
          for f in "$E"/mm_*.gnu.dis.txt; do ARGS+=(--disassembly "$f"); done
          python tools/resolve_bfin_calls.py --map "$W/extracted/mm_bf0.map" "${ARGS[@]}" > "$E/capture_dma_direct_calls.json"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'source1e-capturedma'/'evidence'
          needles=(
              '0xffc0','0x28','0x2c','0x30','0x145','0xa28',
              'CALL','[P','[I','R0 =','R1 =','R2 =','R3 =','P0 =','P1 =','P2 ='
          )
          out={'schema':'mmonochrom.source1e.capture_dma_snippets.v1','files':{}}
          for p in sorted(root.glob('mm_*.gnu.dis.txt')):
              rows=[]
              for i,line in enumerate(p.read_text(errors='replace').splitlines()):
                  if any(n.lower() in line.lower() for n in needles):
                      rows.append({'line_number':i+1,'text':line.strip()})
              out['files'][p.name]=rows
          (root/'capture_dma_snippets.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload text evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOURCE1E-CAPTURE-DMA
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/source1e-capturedma/evidence/*

      - name: Remove firmware and binary material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/source1e-capturedma"
