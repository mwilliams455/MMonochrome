name: Build MMonochrome MONOLIVEGL2B Curve Contract
on:
  workflow_dispatch:
  push:
    branches: [research/monooutput1a-linear-dng]
    paths:
      - 'apk/mono1a/monolivegl2b/**'
      - '.github/workflows/build-mono1a-monolivegl2b.yml'
permissions:
  contents: read
concurrency:
  group: mono-livegl2b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monochrom overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout frozen Android scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1
      - name: Checkout pinned portability tools
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Replay unchanged MONOOUTPUT1A and all parent tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apk/mono1a/monolivegl2b/*.py
          python3 -u - <<'PY' | tee MONOLIVEGL2B_PARENT.log
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono1a-monooutput1a.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0; count=0; name=''
          while i<stop:
              line=lines[i]
              if line.startswith('      - name: '): name=line.split(': ',1)[1]
              if line.strip()!='run: |': i+=1; continue
              i+=1; block=[]
              while i<stop:
                  line=lines[i]
                  if line.startswith('      - name: '): break
                  if line.startswith('          '): block.append(line[10:])
                  elif not line.strip(): block.append('')
                  else: raise SystemExit('Unexpected parent boundary: '+line)
                  i+=1
              count+=1; script=Path('/tmp/monolivegl2b-parent-%02d.sh'%count)
              script.write_text('\n'.join(block)+'\n')
              print('PARENT: '+name,flush=True)
              subprocess.run(['bash',str(script)],check=True)
          assert count==4,count
          print('MONOOUTPUT1A assembly and all parent tests PASS')
          PY
      - name: Apply preview-only curve contract and diagnostic history
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 apk/mono1a/monolivegl2b/apply.py "$ROOT" | tee MONOLIVEGL2B_APPLY.txt
          python3 apk/mono1a/monolivegl2b/test.py "$ROOT" | tee MONOLIVEGL2B_TESTS.txt
          python3 apk/mono1a/monolivegl2a/test_math.py "$ROOT" | tee MONOLIVEGL2B_MATH.txt
          /usr/bin/python3 apk/mono1a/monolivegl2a/test_gpu.py "$ROOT" | tee MONOLIVEGL2B_GPU.json
      - name: Snapshot assembled source and isolation proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil,hashlib
          root=Path('m9base/PhotonCamera');out=Path('monolivegl2b-evidence');out.mkdir(exist_ok=True)
          proof=json.loads((root/'MONOLIVEGL2B_ISOLATION.json').read_text())
          for rel in set(proof['changed'])|set(proof['frozen']):
              p=out/rel;p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(root/rel,p)
          shutil.copyfile(root/'MONOLIVEGL2B_ISOLATION.json',out/'MONOLIVEGL2B_ISOLATION.json')
          for name in ['MONOOUTPUT1A_EXPORT_TEST.json','MONOOUTPUT1A_ISOLATION.json']:
              shutil.copyfile(root/name,out/name)
          for p in Path('apk/mono1a/monolivegl2b').glob('*.py'):shutil.copyfile(p,out/('overlay-'+p.name))
          PY
          printf 'REVISION=MONOLIVEGL2B_CURVECONTRACT\nCOMMIT=%s\nPRIMARY_RENDERER_CHANGED=0\nDNG_EXPORTER_CHANGED=0\nSHADER_CHANGED=0\nDEVICE_HAZE_FIXED_VALIDATED=0\n' "$GITHUB_SHA" > monolivegl2b-evidence/PROVENANCE.txt
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Build MONOLIVEGL2B APK
        shell: bash
        run: |
          set -o pipefail
          cd m9base/PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/MONOLIVEGL2B_GRADLE.log"
      - name: Verify packaged shader curve and source-contract markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee MONOLIVEGL2B_APK_PROOF.txt
          from pathlib import Path
          import zipfile,hashlib,shutil,json
          root=Path('m9base/PhotonCamera');proof=json.loads((root/'MONOLIVEGL2B_ISOLATION.json').read_text())
          apks=list((root/'app/build/outputs/apk/debug').glob('*.apk'));assert len(apks)==1
          for rel,h in proof['frozen'].items():assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==h,rel
          with zipfile.ZipFile(apks[0]) as z:
              for rel in ['assets/shaders/preview/main_fs.glsl','assets/mono/mono_curve02_gl2a.bin']:
                  assert hashlib.sha256(z.read(rel)).hexdigest()==proof['frozen']['app/src/main/'+rel],rel
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for marker in [b'MONOOUTPUT1A_LINEAR_DNG',b'_MONO_LINEAR1A.dng',b'MONOLIVEGL2B_CURVECONTRACT',b'SHUTTERHISTORY2B',b'curveContract2B',b'reported_curve_disagrees_with_request',b'originalRawRetained']:
                  assert marker in dex,marker
          out=Path('MMonochrome_MONOLIVEGL2B_CURVECONTRACT.apk');shutil.copyfile(apks[0],out)
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('MONOLIVEGL2B_APK_SHA256.txt').write_text(digest+'  '+out.name+'\n')
          print('PASS frozen shader/curve, unchanged still/export files, GL2B DEX markers')
          print(digest,out.stat().st_size)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOLIVEGL2B-EVIDENCE
          path: |
            MONOLIVEGL2B_*.log
            MONOLIVEGL2B_*.txt
            MONOLIVEGL2B_GPU.json
            MONOOUTPUT1A_READERS.log
            monolivegl2b-evidence/
          if-no-files-found: warn
      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOLIVEGL2B-CURVECONTRACT
          path: |
            MMonochrome_MONOLIVEGL2B_CURVECONTRACT.apk
            MONOLIVEGL2B_APK_SHA256.txt
            MONOLIVEGL2B_APK_PROOF.txt
            monolivegl2b-evidence/PROVENANCE.txt
          if-no-files-found: error
