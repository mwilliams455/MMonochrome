name: Fix MONO1A SOURCE1A histogram init

on:
  workflow_dispatch:
  push:
    branches:
      - apk/mono1a-native
    paths:
      - '.github/workflows/promote-mono1a-source1a.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: apk/mono1a-native
          fetch-depth: 0

      - name: Replace std::array fill with explicit zero loop
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apk/mono1a/apply-mono1a.py')
          t = p.read_text()
          old = '            indexHist.fill(0);\n'
          new = '            for (size_t j = 0; j < indexHist.size(); ++j) indexHist[j] = 0;\n'
          n = t.count(old)
          if n != 1:
              raise SystemExit(f'indexHist.fill anchor count={n}, expected 1')
          p.write_text(t.replace(old, new, 1))
          PY
          python3 -m py_compile apk/mono1a/apply-mono1a.py
          grep -n 'indexHist\[j\] = 0' apk/mono1a/apply-mono1a.py

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/mono1a/apply-mono1a.py
          git commit -m 'mono: fix SOURCE1A histogram initialization'
          git push origin HEAD:apk/mono1a-native

      - name: Dispatch SOURCE1A build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-mono1a-native.yml --ref apk/mono1a-native
