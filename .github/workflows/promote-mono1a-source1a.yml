name: Promote MONO1A SOURCE1A

on:
  workflow_dispatch:
  push:
    branches:
      - apk/mono1a-native
    paths:
      - '.github/workflows/promote-mono1a-source1a.yml'

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: apk/mono1a-native
          fetch-depth: 0

      - name: Apply SOURCE1A promotion patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apk/mono1a/promote-source1a.py')
          t = p.read_text()
          start = t.index('# Capture-time queued snapshots are frozen before the background worker')
          end = t.index('renderer.write_text(r)\n', start)
          t = t[:start] + t[end:]
          p.write_text(t)
          PY
          python3 -m py_compile apk/mono1a/promote-source1a.py
          python3 apk/mono1a/promote-source1a.py
          python3 -m py_compile apk/mono1a/apply-mono1a.py
          grep -n 'MONO1A_SOURCE1A' apk/mono1a/apply-mono1a.py
          grep -n "versionName '0.02-mmonochrome-source1a'" apk/mono1a/apply-mono1a.py

      - name: Commit SOURCE1A
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/mono1a/apply-mono1a.py .github/workflows/build-mono1a-native.yml
          git commit -m 'mono: add SOURCE1A truthful pipeline diagnostics'
          git push origin HEAD:apk/mono1a-native

      - name: Dispatch SOURCE1A build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-mono1a-native.yml --ref apk/mono1a-native
