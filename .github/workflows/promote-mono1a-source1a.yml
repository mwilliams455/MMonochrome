name: Fix MONO1A app_name XML replacement

on:
  workflow_dispatch:
  push:
    branches:
      - apk/mono1a-native
    paths:
      - '.github/workflows/promote-mono1a-source1a.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: apk/mono1a-native
          fetch-depth: 0

      - name: Replace unsafe re.sub backreference template
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apk/mono1a/apply-mono1a.py')
          lines = p.read_text().splitlines(True)
          hits = [i for i, line in enumerate(lines)
                  if 'M Monochrom Camera' in line and 'count=1)' in line]
          if len(hits) != 1:
              raise SystemExit(f'app_name replacement anchor count={len(hits)}, expected 1')
          lines[hits[0]] = '    lambda m: m.group(1) + "M Monochrom Camera" + m.group(2), s, count=1)\n'
          p.write_text(''.join(lines))
          PY
          python3 -m py_compile apk/mono1a/apply-mono1a.py
          grep -n 'M Monochrom Camera' apk/mono1a/apply-mono1a.py

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/mono1a/apply-mono1a.py
          git commit -m 'mono: fix MONO1A app_name XML replacement'
          git push origin HEAD:apk/mono1a-native

      - name: Dispatch SOURCE1A build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-mono1a-native.yml --ref apk/mono1a-native
