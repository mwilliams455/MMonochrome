name: M Monochrom Sharpness Host Oracle

on:
  workflow_dispatch:
  push:
    branches:
      - research/mm-sharpness-lutbank1a
    paths:
      - '.github/workflows/mm-sharpness-host-oracle.yml'
      - 'tools/mm_sharpness_host_oracle.py'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/pwad.py'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts
        run: python3 -m py_compile tools/mm_sharpness_host_oracle.py tools/recover_leica_m9_mm_shared_key.py tools/pwad.py
      - name: Download and decrypt canonical M Monochrom firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmoracle"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmoracle/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmoracle/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py "$RUNNER_TEMP/mmoracle/m9.upd" "$RUNNER_TEMP/mmoracle/mm.upm" --mm-out "$RUNNER_TEMP/mmoracle/mm.dec" --meta-out "$RUNNER_TEMP/mmoracle/recovery_meta.json"
      - name: Run Standard sharpness host oracle
        run: |
          set -euo pipefail
          python3 tools/mm_sharpness_host_oracle.py "$RUNNER_TEMP/mmoracle/mm.dec" --out "$RUNNER_TEMP/mmoracle/MM_SHARPNESS_HOST_ORACLE.json" | tee "$RUNNER_TEMP/mmoracle/MM_SHARPNESS_HOST_ORACLE.txt"
      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-SHARPNESS-HOST-ORACLE1A
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mmoracle/recovery_meta.json
            ${{ runner.temp }}/mmoracle/MM_SHARPNESS_HOST_ORACLE.json
            ${{ runner.temp }}/mmoracle/MM_SHARPNESS_HOST_ORACLE.txt
      - name: Remove firmware material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmoracle/m9.upd" "$RUNNER_TEMP/mmoracle/mm.upm" "$RUNNER_TEMP/mmoracle/mm.dec"
