name: Build MMonochrome MONOOUTPUT1B Durable Export
on:
  workflow_dispatch:
  push:
    branches: [research/monooutput1b-durable-export]
    paths:
      - 'apk/mono1a/monooutput1b/**'
      - '.github/workflows/build-mono1a-monooutput1b.yml'
permissions:
  contents: read
concurrency:
  group: mono-output1b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monochrom overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout frozen Android scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1
      - name: Checkout pinned portability tools
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Replay MONOAUTO1A and all parent validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apk/mono1a/monooutput1b/*.py
          python3 -u - <<'PY' | tee MONOOUTPUT1B_PARENT.log
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono1a-monoauto1a.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0;count=0
          while i<stop:
              if lines[i].strip()!='run: |':i+=1;continue
              i+=1;block=[]
              while i<stop and not lines[i].startswith('      - name: '):
                  line=lines[i]
                  if line.startswith('          '):block.append(line[10:])
                  elif not line.strip():block.append('')
                  else:raise SystemExit('Unexpected parent boundary '+line)
                  i+=1
              count+=1;p=Path('/tmp/mono-output1b-parent-%d.sh'%count);p.write_text('\n'.join(block)+'\n')
              subprocess.run(['bash',str(p)],check=True)
          assert count==3,count
          print('MONOAUTO1A assembly and parent exposure/render/DNG tests PASS')
          PY
      - name: Apply storage repair and test real 12MP DNG transport
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 apk/mono1a/monooutput1b/apply.py "$ROOT" | tee MONOOUTPUT1B_APPLY.txt
          python3 apk/mono1a/monooutput1b/test.py "$ROOT" | tee MONOOUTPUT1B_TESTS.txt
          /usr/bin/python3 apk/mono1a/monolivegl2a/test_gpu.py "$ROOT" | tee MONOOUTPUT1B_GPU.json
      - name: Snapshot runtime source and full isolation proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil
          root=Path('m9base/PhotonCamera');out=Path('monooutput1b-evidence');out.mkdir(exist_ok=True)
          proof=json.loads((root/'MONOOUTPUT1B_ISOLATION.json').read_text())
          for rel in set(proof['changed'])|set(proof['frozen'])|set(proof['new']):
              p=out/rel;p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(root/rel,p)
          for name in ['MONOOUTPUT1B_ISOLATION.json','MONOOUTPUT1B_TEST_REPORT.json','MONOAUTO1A_ISOLATION.json','MONOOUTPUT1A_EXPORT_TEST.json']:
              shutil.copyfile(root/name,out/name)
          shutil.copytree('apk/mono1a/monooutput1b',out/'overlay',ignore=shutil.ignore_patterns('__pycache__'))
          PY
          printf 'REVISION=MONOOUTPUT1B_DURABLE_EXPORT\nCOMMIT=%s\nEXPOSURE_PLAN=MONOAUTO1A_EXPOSUREPLAN\nSTILL_RENDERER_CHANGED=0\nDNG_WRITER_AND_PLANE_CHANGED=0\nSHADER_CHANGED=0\nEXPOSURE_ALLOCATOR_CHANGED=0\nPUBLICATION_RETRY=1\nRESTART_RECOVERY=1\nPHONE_VALIDATED=0\n' "$GITHUB_SHA" > monooutput1b-evidence/PROVENANCE.txt
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Build MONOOUTPUT1B APK
        shell: bash
        run: |
          set -o pipefail
          cd m9base/PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/MONOOUTPUT1B_GRADLE.log"
      - name: Verify packaged frozen rendering and durable-export markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee MONOOUTPUT1B_APK_PROOF.txt
          from pathlib import Path
          import zipfile,hashlib,shutil,json
          root=Path('m9base/PhotonCamera');proof=json.loads((root/'MONOOUTPUT1B_ISOLATION.json').read_text())
          apks=list((root/'app/build/outputs/apk/debug').glob('*.apk'));assert len(apks)==1
          for rel,h in proof['frozen'].items():assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==h,rel
          with zipfile.ZipFile(apks[0]) as z:
              for rel in ['assets/shaders/preview/main_fs.glsl','assets/mono/mono_curve02_gl2a.bin']:
                  assert hashlib.sha256(z.read(rel)).hexdigest()==proof['frozen']['app/src/main/'+rel],rel
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for marker in [b'MONOOUTPUT1B_DURABLE_EXPORT',b'MonoDngSpool1B',b'staged_publication_pending',b'publication_retry_pending',b'publicReadbackVerified',b'MONOAUTO1A_EXPOSUREPLAN',b'monoExposurePlan1A',b'MONOLIVEGL2B_CURVECONTRACT',b'_MONO_LINEAR1A.dng']:
                  assert marker in dex,marker
          out=Path('MMonochrome_MONOOUTPUT1B_DURABLE_EXPORT.apk');shutil.copyfile(apks[0],out)
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('MONOOUTPUT1B_APK_SHA256.txt').write_text(digest+'  '+out.name+'\n')
          print('PASS unchanged runtime files, packaged curve/shader, durable-export and exposure-plan DEX markers')
          print(digest,out.stat().st_size)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOOUTPUT1B-EVIDENCE
          include-hidden-files: true
          path: |
            MONOOUTPUT1B_*.log
            MONOOUTPUT1B_*.txt
            MONOOUTPUT1B_GPU.json
            MONOOUTPUT1A_READERS.log
            monooutput1b-evidence/
          if-no-files-found: warn
      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOOUTPUT1B-DURABLE-EXPORT
          path: |
            MMonochrome_MONOOUTPUT1B_DURABLE_EXPORT.apk
            MONOOUTPUT1B_APK_SHA256.txt
            MONOOUTPUT1B_APK_PROOF.txt
            monooutput1b-evidence/PROVENANCE.txt
          if-no-files-found: error
