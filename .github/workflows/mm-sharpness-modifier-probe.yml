name: M Monochrom Sharpness Modifier Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/mm-sharpness-lutbank1a
    paths:
      - '.github/workflows/mm-sharpness-modifier-probe.yml'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/mm_sharpness_consumer_trace.py'
      - 'tools/mm_lutbank_geometry_probe.py'
      - 'tools/mm_sharpness_modifier_probe.py'
      - 'tools/pwad.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/recover_leica_m9_mm_shared_key.py \
            tools/mm_sharpness_consumer_trace.py \
            tools/mm_lutbank_geometry_probe.py \
            tools/mm_sharpness_modifier_probe.py
      - name: Download and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmsharpmod"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmsharpmod/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmsharpmod/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py \
            "$RUNNER_TEMP/mmsharpmod/m9.upd" \
            "$RUNNER_TEMP/mmsharpmod/mm.upm" \
            --mm-out "$RUNNER_TEMP/mmsharpmod/mm.dec" \
            --meta-out "$RUNNER_TEMP/mmsharpmod/recovery_meta.json"
      - name: Probe modifier matrix and descriptor arithmetic
        run: |
          set -euo pipefail
          python3 tools/mm_sharpness_modifier_probe.py \
            "$RUNNER_TEMP/mmsharpmod/mm.dec" \
            --outdir "$RUNNER_TEMP/mmsharpmod/derived"
          cat "$RUNNER_TEMP/mmsharpmod/derived/MM_SHARPNESS_MODIFIER_PROBE.txt"
      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-SHARPNESS-MODIFIER1A
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mmsharpmod/recovery_meta.json
            ${{ runner.temp }}/mmsharpmod/derived/MM_SHARPNESS_MODIFIER_PROBE.json
            ${{ runner.temp }}/mmsharpmod/derived/MM_SHARPNESS_MODIFIER_PROBE.txt
      - name: Remove firmware material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmsharpmod/m9.upd" "$RUNNER_TEMP/mmsharpmod/mm.upm" "$RUNNER_TEMP/mmsharpmod/mm.dec"
