name: Build MMonochrome MONOAUTO1D1H Save Lookup

on:
  workflow_dispatch:
  push:
    branches: [research/monoauto1d1h-savelookup1a]
    paths:
      - 'apk/mono1a/monoauto1d1h/**'
      - '.github/workflows/build-mono1a-monoauto1d1h.yml'
permissions:
  contents: read
concurrency:
  group: mono-auto1d1h-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monochrom overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout frozen Android scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1
      - name: Checkout pinned portability tools
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Replay MONOAUTO1D1G parent
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apk/mono1a/monoauto1d1h/*.py
          python3 -u - <<'PY' | tee MONOAUTO1D1H_PARENT.log
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono1a-monoauto1d1g.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0;count=0
          while i<stop:
              if lines[i].strip()!='run: |':
                  i+=1;continue
              i+=1;block=[]
              while i<stop and not lines[i].startswith('      - name: '):
                  line=lines[i]
                  if line.startswith('          '):block.append(line[10:])
                  elif not line.strip():block.append('')
                  else:raise SystemExit('Unexpected parent boundary '+line)
                  i+=1
              count+=1
              p=Path('/tmp/mono-auto1d1h-parent-%d.sh'%count)
              p.write_text('\n'.join(block)+'\n')
              subprocess.run(['bash',str(p)],check=True)
          assert count==3,count
          print('MONOAUTO1D1G parent assembly/tests PASS')
          PY
      - name: Apply and test safe save lookup
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          python3 apk/mono1a/monoauto1d1h/apply.py "$ROOT" | tee MONOAUTO1D1H_APPLY.txt
          python3 apk/mono1a/monoauto1d1h/test.py "$ROOT" | tee MONOAUTO1D1H_TESTS.txt
      - name: Snapshot evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/m9base/PhotonCamera"
          OUT=monoauto1d1h-evidence
          mkdir -p "$OUT"
          cp "$ROOT/MONOSAVELOOKUP1A_ISOLATION.json" "$OUT/"
          cp "$ROOT/MONOSAVELOOKUP1A_TEST_REPORT.json" "$OUT/"
          cp "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/m9/export/MonoDngPublicWriter1B.java" "$OUT/"
          cp apk/mono1a/monoauto1d1h/*.py apk/mono1a/monoauto1d1h/*.java apk/mono1a/monoauto1d1h/README.md "$OUT/"
          printf 'REVISION=MONOOUTPUT1H_SAVELOOKUP1A\nCOMMIT=%s\nPARENT=b738ecc5738b0c5a7bb84b8d584c60f439d9e23e\nNEW_SAVE_FULL_FOLDER_SCANS=1\nFRESH_FINAL_COLLISION_CHECK=1\nNEGATIVE_CACHE=0\nPHOTOGRAPHIC_SOURCE_CHANGED=0\nEXPOSURE_CHANGED=0\nDIAGNOSTICS_ENABLED_FOR_VALIDATION=1\nPHONE_VALIDATED=0\n' "$GITHUB_SHA" > "$OUT/PROVENANCE.txt"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Build MONOAUTO1D1H APK
        shell: bash
        run: |
          set -o pipefail
          cd m9base/PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/MONOAUTO1D1H_GRADLE.log"
      - name: Verify packaged markers and frozen source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee MONOAUTO1D1H_APK_PROOF.txt
          from pathlib import Path
          import zipfile,hashlib,shutil,json
          root=Path('m9base/PhotonCamera')
          apks=list((root/'app/build/outputs/apk/debug').glob('*.apk'));assert len(apks)==1
          with zipfile.ZipFile(apks[0]) as z:
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for marker in [b'MONOOUTPUT1H_SAVELOOKUP1A',b'publicInitialQuerySkipped',b'publicLookupParentUri1H',
                  b'MONOOUTPUT1G_RECEIPTHYGIENE1A',b'MMONOSPOOLRESET1B_ONCE',
                  b'MONOAUTO1D_PLACEMENTASSIST1E_BUFFERHYGIENE1A',b'MONOOUTPUT1E_BASELINE_IFD0']:
                  assert marker in dex,marker
          proof=json.loads((root/'MONOSAVELOOKUP1A_ISOLATION.json').read_text())
          for rel,expected in proof['frozenSourceHashes'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==expected,rel
          assert not proof['exposurePolicyChanged'] and not proof['dngPixelMathChanged']
          assert proof['freshFinalCollisionQueryRetained'] and not proof['negativeCacheAdded']
          out=Path('MMonochrome_MONOAUTO1D_PLACEMENTASSIST1H_SAVELOOKUP1A.apk')
          shutil.copyfile(apks[0],out)
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('MONOAUTO1D1H_APK_SHA256.txt').write_text(digest+'  '+out.name+'\n')
          print('PASS save lookup APK; frozen sources:',proof['frozenSourceFileCount'])
          print(digest,out.stat().st_size)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOAUTO1D-PLACEMENTASSIST1H-SAVELOOKUP1A-EVIDENCE
          path: |
            MONOAUTO1D1H_*.log
            MONOAUTO1D1H_*.txt
            monoauto1d1h-evidence/
          if-no-files-found: warn
      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-MONOAUTO1D-PLACEMENTASSIST1H-SAVELOOKUP1A
          path: |
            MMonochrome_MONOAUTO1D_PLACEMENTASSIST1H_SAVELOOKUP1A.apk
            MONOAUTO1D1H_APK_SHA256.txt
            MONOAUTO1D1H_APK_PROOF.txt
            monoauto1d1h-evidence/PROVENANCE.txt
          if-no-files-found: error
