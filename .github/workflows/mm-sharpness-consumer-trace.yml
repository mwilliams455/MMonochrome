name: M Monochrom Sharpness Consumer Trace

on:
  workflow_dispatch:
  push:
    branches:
      - research/mm-sharpness-lutbank1a
    paths:
      - '.github/workflows/mm-sharpness-consumer-trace.yml'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/mm_sharpness_consumer_trace.py'
      - 'tools/pwad.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify research scripts
        run: |
          set -euo pipefail
          python3 -m py_compile tools/recover_leica_m9_mm_shared_key.py
          python3 -m py_compile tools/mm_sharpness_consumer_trace.py

      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors \
              -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror \
              --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          "$OBJDUMP" -i | grep -Eiq 'bfin|blackfin'
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"

      - name: Download and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmsharp"
          curl --fail --location --retry 4 --retry-all-errors \
            -o "$RUNNER_TEMP/mmsharp/m9.upd" \
            'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors \
            -o "$RUNNER_TEMP/mmsharp/mm.upm" \
            'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py \
            "$RUNNER_TEMP/mmsharp/m9.upd" "$RUNNER_TEMP/mmsharp/mm.upm" \
            --mm-out "$RUNNER_TEMP/mmsharp/mm.dec" \
            --meta-out "$RUNNER_TEMP/mmsharp/recovery_meta.json"
          echo 'c9e14ee475408802c83774f37b19c85c57663d9840e8e4c2cfe80e14dec9a7ae  '"$RUNNER_TEMP/mmsharp/mm.dec" | sha256sum -c --strict

      - name: Trace Monochrom BF561 sharpness consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/mm_sharpness_consumer_trace.py \
            "$RUNNER_TEMP/mmsharp/mm.dec" \
            --objdump "$OBJDUMP" \
            --outdir "$RUNNER_TEMP/mmsharp/derived"
          cat "$RUNNER_TEMP/mmsharp/derived/mm_sharpness_consumer_trace.txt"

      - name: Publish derived text evidence only
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-SHARPNESS-CONSUMERTRACE1B
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mmsharp/recovery_meta.json
            ${{ runner.temp }}/mmsharp/derived/bf561_manifest.json
            ${{ runner.temp }}/mmsharp/derived/mm_sharpness_consumer_trace.json
            ${{ runner.temp }}/mmsharp/derived/mm_sharpness_consumer_trace.txt

      - name: Remove firmware material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mmsharp/m9.upd" "$RUNNER_TEMP/mmsharp/mm.upm" \
                 "$RUNNER_TEMP/mmsharp/mm.dec"
