name: Repair SOURCE1C promoter quoting

on:
  workflow_dispatch:
  push:
    branches:
      - apk/mono1a-source1c
    paths:
      - '.github/workflows/repair-source1c-promoter.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk/mono1a-source1c
          fetch-depth: 0

      - name: Repair nested quote delimiter
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apk/mono1a/promote-source1c.py')
          s = p.read_text()
          start = "    '''            diag.put(\"jpegPath\", jpgPath.toString());\n"
          end = "            }\n''',\n    \"SOURCE1C auxiliary JPEG diagnostics\",\n"
          if s.count(start) != 1 or s.count(end) != 1:
              raise SystemExit(f'quote anchors start={s.count(start)} end={s.count(end)}')
          s = s.replace(start, '    \"\"\"            diag.put(\"jpegPath\", jpgPath.toString());\n', 1)
          s = s.replace(end, '            }\n\"\"\",\n    \"SOURCE1C auxiliary JPEG diagnostics\",\n', 1)
          p.write_text(s)
          PY
          python3 -m py_compile apk/mono1a/promote-source1c.py

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/mono1a/promote-source1c.py
          git commit -m 'fix: repair SOURCE1C promoter quoting'
          git push origin HEAD:apk/mono1a-source1c

      - name: Dispatch SOURCE1C promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-mono1a-source1c.yml --ref apk/mono1a-source1c
