name: M Monochrom BF561 Current Job Mask Mutation

on:
  workflow_dispatch:
  push:
    branches:
      - research/mm-sharpness-lutbank1a
    paths:
      - '.github/workflows/mm-bf561-currentjob-mask-mutation.yml'
      - 'tools/mm_bf561_currentjob_mask_mutation.py'
      - 'tools/mm_sharpness_consumer_trace.py'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/pwad.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts
        run: python3 -m py_compile tools/mm_bf561_currentjob_mask_mutation.py tools/mm_sharpness_consumer_trace.py tools/recover_leica_m9_mm_shared_key.py tools/pwad.py
      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          "$OBJDUMP" -i | grep -Eiq 'bfin|blackfin'
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
      - name: Download and decrypt canonical M Monochrom firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmcurjob"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmcurjob/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmcurjob/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py "$RUNNER_TEMP/mmcurjob/m9.upd" "$RUNNER_TEMP/mmcurjob/mm.upm" --mm-out "$RUNNER_TEMP/mmcurjob/mm.dec" --meta-out "$RUNNER_TEMP/mmcurjob/recovery_meta.json"
      - name: Trace current-job mask mutation
        run: |
          set -euo pipefail
          python3 tools/mm_bf561_currentjob_mask_mutation.py "$RUNNER_TEMP/mmcurjob/mm.dec" --objdump "$OBJDUMP" --outdir "$RUNNER_TEMP/mmcurjob/derived"
          cat "$RUNNER_TEMP/mmcurjob/derived/MM_BF561_CURRENTJOB_MASK_MUTATION.txt"
      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-BF561-CURRENTJOB-MASK-MUTATION1A
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mmcurjob/recovery_meta.json
            ${{ runner.temp }}/mmcurjob/derived/MM_BF561_CURRENTJOB_MASK_MUTATION.json
            ${{ runner.temp }}/mmcurjob/derived/MM_BF561_CURRENTJOB_MASK_MUTATION.txt
      - name: Remove firmware material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmcurjob/m9.upd" "$RUNNER_TEMP/mmcurjob/mm.upm" "$RUNNER_TEMP/mmcurjob/mm.dec"
