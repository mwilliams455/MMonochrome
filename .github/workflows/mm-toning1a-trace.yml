name: M Monochrom Toning Firmware Trace

on:
  workflow_dispatch:
  push:
    branches: [research/mm-toning1a]
    paths:
      - 'tools/mm_toning1a_trace.py'
      - '.github/workflows/mm-toning1a-trace.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts
        run: python3 -m py_compile tools/mm_toning1a_trace.py tools/recover_leica_m9_mm_shared_key.py tools/pwad.py
      - name: Install or build Blackfin objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-multiarch curl xz-utils build-essential
          OBJDUMP="$(command -v objdump)"
          if ! "$OBJDUMP" -i 2>/dev/null | grep -Eiq 'bfin|blackfin'; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 4 --retry-all-errors -o binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
            tar -xf binutils-2.44.tar.xz
            mkdir -p binutils-build && cd binutils-build
            ../binutils-2.44/configure --target=bfin-elf --disable-nls --disable-werror --disable-gdb --disable-gas --disable-ld --disable-sim
            make -j2 all-binutils
            OBJDUMP="$PWD/binutils/objdump"
          fi
          "$OBJDUMP" -i | grep -Eiq 'bfin|blackfin'
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
      - name: Download and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmtoning"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmtoning/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmtoning/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo "c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  $RUNNER_TEMP/mmtoning/m9.upd" | sha256sum -c -
          echo "53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  $RUNNER_TEMP/mmtoning/mm.upm" | sha256sum -c -
          python3 tools/recover_leica_m9_mm_shared_key.py "$RUNNER_TEMP/mmtoning/m9.upd" "$RUNNER_TEMP/mmtoning/mm.upm" --mm-out "$RUNNER_TEMP/mmtoning/mm.dec" --meta-out "$RUNNER_TEMP/mmtoning/recovery_meta.json"
      - name: Trace Toning
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/mm_toning1a_trace.py "$RUNNER_TEMP/mmtoning/mm.dec" --objdump "$OBJDUMP" --outdir "$RUNNER_TEMP/mmtoning/derived"
          cat "$RUNNER_TEMP/mmtoning/derived/MM_TONING1A_TRACE.txt"
      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-TONING1A-TRACE
          retention-days: 30
          path: |
            ${{ runner.temp }}/mmtoning/recovery_meta.json
            ${{ runner.temp }}/mmtoning/derived/MM_TONING1A_TRACE.json
            ${{ runner.temp }}/mmtoning/derived/MM_TONING1A_TRACE.txt
          if-no-files-found: error
      - name: Remove firmware material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmtoning/m9.upd" "$RUNNER_TEMP/mmtoning/mm.upm" "$RUNNER_TEMP/mmtoning/mm.dec"
