name: Promote MONO1A SOURCE1B diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - apk/mono1a-source1b-diagnostics
    paths:
      - '.github/workflows/promote-mono1a-source1b.yml'

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SOURCE1B branch
        uses: actions/checkout@v4
        with:
          ref: apk/mono1a-source1b-diagnostics
          fetch-depth: 0

      - name: Apply SOURCE1B patch to MONO1A overlay
        run: |
          set -euo pipefail
          python3 apk/mono1a/promote-source1b.py
          python3 -m py_compile apk/mono1a/apply-mono1a.py
          grep -n 'MONO1A_SOURCE1B' apk/mono1a/apply-mono1a.py
          grep -n 'greenOnlyIndexQ50' apk/mono1a/apply-mono1a.py
          grep -n 'rgbMeanIndexQ50' apk/mono1a/apply-mono1a.py
          grep -n 'stats\[32\]' apk/mono1a/apply-mono1a.py

      - name: Commit promoted overlay
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/mono1a/apply-mono1a.py
          git commit -m 'mono: promote SOURCE1B same-buffer source controls'
          git push origin HEAD:apk/mono1a-source1b-diagnostics

      - name: Dispatch trusted MONO1A build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-mono1a-native.yml --ref apk/mono1a-source1b-diagnostics
