name: Export DARKFRAME1A exact source slice

on:
  workflow_dispatch:
  push:
    branches: [research/mono-darkframe1a]
    paths:
      - '.github/workflows/export-mono-darkframe1a-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: research/m9-upstream2r-fix1
          path: m9upstream
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rebuild validated parent
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono-leicadiagnostics1a.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0
          while i<stop:
              if lines[i].strip()!='run: |': i+=1; continue
              i+=1;block=[]
              while i<stop and not lines[i].startswith('      - name: '):
                  line=lines[i]
                  if line.startswith('          '): block.append(line[10:])
                  elif not line.strip(): block.append('')
                  else: raise SystemExit(line)
                  i+=1
              p=Path('/tmp/rebuild.sh');p.write_text('\n'.join(block)+'\n')
              subprocess.run(['bash',str(p)],check=True)
          PY
      - name: Collect exact sources
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/darksrc";mkdir -p "$OUT"
          ROOT="$GITHUB_WORKSPACE/modern"
          for rel in             app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9R35Renderer.java             app/src/main/java/com/particlesdevs/photoncamera/m9/render/M9PrimaryRenderQueue.java             app/src/main/java/com/particlesdevs/photoncamera/processing/render/Parameters.java             app/src/main/java/com/particlesdevs/photoncamera/processing/ImageBufferUtils.java             app/src/main/java/com/particlesdevs/photoncamera/capture/CaptureController.java             app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/IsoExpoSelector.java             app/src/main/java/com/particlesdevs/photoncamera/api/Camera2ApiAutoFix.java; do
              mkdir -p "$OUT/$(dirname "$rel")"; cp "$ROOT/$rel" "$OUT/$rel"
          done
          tar -C "$OUT" -czf "$RUNNER_TEMP/MMonochrome-DARKFRAME1A-SOURCE.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-DARKFRAME1A-SOURCE
          path: ${{ runner.temp }}/MMonochrome-DARKFRAME1A-SOURCE.tar.gz
          if-no-files-found: error
