name: M Monochrom Noise Matrix Data Gate

on:
  workflow_dispatch:
  push:
    branches:
      - research/mm-sharpness-lutbank1a
    paths:
      - '.github/workflows/mm-noise-matrix-data-gate.yml'
      - 'tools/mm_noise_matrix_data_gate.py'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/pwad.py'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts
        run: python3 -m py_compile tools/mm_noise_matrix_data_gate.py tools/recover_leica_m9_mm_shared_key.py tools/pwad.py
      - name: Download and decrypt canonical M Monochrom firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmnoisegate"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmnoisegate/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmnoisegate/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py "$RUNNER_TEMP/mmnoisegate/m9.upd" "$RUNNER_TEMP/mmnoisegate/mm.upm" --mm-out "$RUNNER_TEMP/mmnoisegate/mm.dec" --meta-out "$RUNNER_TEMP/mmnoisegate/recovery_meta.json"
      - name: Extract matrix data
        run: |
          set -euo pipefail
          python3 tools/mm_noise_matrix_data_gate.py "$RUNNER_TEMP/mmnoisegate/mm.dec" --out "$RUNNER_TEMP/mmnoisegate/MM_NOISE_MATRIX_DATA_GATE.json"
      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-NOISE-MATRIX-DATA-GATE1A
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mmnoisegate/recovery_meta.json
            ${{ runner.temp }}/mmnoisegate/MM_NOISE_MATRIX_DATA_GATE.json
      - name: Remove firmware material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmnoisegate/m9.upd" "$RUNNER_TEMP/mmnoisegate/mm.upm" "$RUNNER_TEMP/mmnoisegate/mm.dec"
