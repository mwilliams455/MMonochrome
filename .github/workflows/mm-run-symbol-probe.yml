name: M Monochrom Run Symbol Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/mm-sharpness-lutbank1a
    paths:
      - '.github/workflows/mm-run-symbol-probe.yml'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/mm_run_symbol_probe.py'
      - 'tools/mm_sharpness_consumer_trace.py'
      - 'tools/pwad.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts
        run: python3 -m py_compile tools/recover_leica_m9_mm_shared_key.py tools/mm_run_symbol_probe.py tools/mm_sharpness_consumer_trace.py tools/pwad.py
      - name: Download and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmrunsym"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmrunsym/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmrunsym/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py "$RUNNER_TEMP/mmrunsym/m9.upd" "$RUNNER_TEMP/mmrunsym/mm.upm" --mm-out "$RUNNER_TEMP/mmrunsym/mm.dec" --meta-out "$RUNNER_TEMP/mmrunsym/recovery_meta.json"
      - name: Map Run helper symbols
        run: |
          set -euo pipefail
          python3 tools/mm_run_symbol_probe.py "$RUNNER_TEMP/mmrunsym/mm.dec" --outdir "$RUNNER_TEMP/mmrunsym/derived"
      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-RUN-SYMBOL-PROBE1A
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mmrunsym/recovery_meta.json
            ${{ runner.temp }}/mmrunsym/derived/MM_RUN_SYMBOL_PROBE.json
            ${{ runner.temp }}/mmrunsym/derived/MM_RUN_SYMBOL_PROBE.txt
      - name: Remove firmware material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmrunsym/m9.upd" "$RUNNER_TEMP/mmrunsym/mm.upm" "$RUNNER_TEMP/mmrunsym/mm.dec"
