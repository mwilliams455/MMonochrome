name: Build MMonochrome LEICAAUTOISO1A

on:
  workflow_dispatch:
  push:
    branches: [research/mono-leicasettings1d-autoiso1a]
    paths:
      - 'apk/mono1a/upstream1b/**'
      - 'apk/mono1a/monosettings1a/**'
      - 'apk/mono1a/monosettings1b/**'
      - 'apk/mono1a/monoleicasettings1a/**'
      - 'apk/mono1a/monoleicasettings1b/**'
      - 'apk/mono1a/monoleicasettings1bfix1/**'
      - 'apk/mono1a/monoleicasettings1bfix2/**'
      - 'apk/mono1a/monoleicasettings1c/**'
      - 'apk/mono1a/monoleicasettings1cpreviewfix1/**'
      - 'apk/mono1a/monoleicasettings1cpreviewfix2/**'
      - 'apk/mono1a/monoleicasettings1d/**'
      - 'tools/generate_mm_sharpness5.py'
      - 'tools/generate_mm_contrast_curves.py'
      - '.github/workflows/build-mono-leicaautoiso1a.yml'

permissions:
  contents: read

concurrency:
  group: mono-leicaautoiso1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Monochrom overlays
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout legacy validated scaffold
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: fb1db92ef78df70442b9fee879795e584f2170cf
          path: m9base
          fetch-depth: 1

      - name: Checkout published M9 modern reconstruction
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: research/m9-upstream2r-fix1
          path: m9upstream
          fetch-depth: 1

      - name: Checkout pinned Monochrom portability tools
        uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: 57476072a146d53da11235667f9681e64427c9cf
          path: m9port
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild exact LEICASHARPNESS1C PREVIEWFIX2 parent
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY' 2>&1 | tee LEICAAUTOISO1A_PARENT.log
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/build-mono-leicasharpness1c-previewfix2.yml').read_text().splitlines()
          stop=lines.index('      - name: Set up Android SDK')
          i=0; count=0
          while i<stop:
              if lines[i].strip()!='run: |':
                  i+=1; continue
              i+=1; block=[]
              while i<stop and not lines[i].startswith('      - name: '):
                  line=lines[i]
                  if line.startswith('          '): block.append(line[10:])
                  elif not line.strip(): block.append('')
                  else: raise SystemExit('Unexpected parent boundary '+line)
                  i+=1
              count+=1
              p=Path('/tmp/mono-autoiso-parent-%d.sh'%count)
              p.write_text('\n'.join(block)+'\n')
              subprocess.run(['bash',str(p)],check=True)
          assert count==16,count
          print('LEICASHARPNESS1C PREVIEWFIX2 parent PASS')
          PY

      - name: Apply Leica Auto ISO Maximum
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/modern"
          python3 -m py_compile apk/mono1a/monoleicasettings1d/*.py
          python3 -u apk/mono1a/monoleicasettings1d/apply.py "$ROOT" | tee LEICAAUTOISO1A_APPLY.txt
          python3 -u apk/mono1a/monoleicasettings1d/test.py "$ROOT" | tee LEICAAUTOISO1A_TEST.txt

      - name: Generate exact Leica Contrast bank inside build tree
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/modern"
          TMP="$RUNNER_TEMP/mmcontrast-autoiso"
          mkdir -p "$TMP"
          curl --fail --location --retry 4 --retry-all-errors             -o "$TMP/m9.upd"             'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors             -o "$TMP/mm.upm"             'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          echo "c3d30d7124abe6a3674cf2095719c178454b8773b1454cb70cf54ae468024da4  $TMP/m9.upd" | sha256sum -c -
          echo "53330385edfbfb9beeffa06645bffa2789e27dda614869107698919464f80ad8  $TMP/mm.upm" | sha256sum -c -
          python3 tools/recover_leica_m9_mm_shared_key.py             "$TMP/m9.upd" "$TMP/mm.upm"             --mm-out "$TMP/mm.dec"             --meta-out "$TMP/recovery_meta.json"
          python3 tools/generate_mm_contrast_curves.py "$TMP/mm.dec"             --cpp-out "$TMP/mm_contrast_unused.inc"             --asset-out "$ROOT/app/src/main/assets/mono/mono_contrast_curves.bin"             --java-out "$TMP/MonoContrastCurvesUnused.java"             --report-out "$GITHUB_WORKSPACE/LEICAAUTOISO1A_CONTRAST_ASSET.json"             | tee "$GITHUB_WORKSPACE/LEICAAUTOISO1A_CONTRAST_ASSET.txt"
          echo "ac010ac0a107fb4b98ed817f24b4b9ab2d739fcfd70571b4f7d8375335e293c6  $ROOT/app/src/main/assets/mono/mono_contrast_curves.bin" | sha256sum -c -
          rm -f "$TMP/m9.upd" "$TMP/mm.upm" "$TMP/mm.dec"

      - name: Set candidate identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('modern/app/build.gradle')
          s=p.read_text()
          s,n=re.subn(r'versionCode\s+\d+', 'versionCode 26699', s, count=1); assert n==1,n
          s,n=re.subn(r"versionName\s+'[^']+'", "versionName '0.11-monochrome-modernui1a-leicaautoiso1a'", s, count=1); assert n==1,n
          p.write_text(s)
          PY

      - name: Verify Auto ISO isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee LEICAAUTOISO1A_POLICY_PROOF.txt
          from pathlib import Path
          import hashlib,json
          root=Path('modern')
          proof=json.loads((root/'LEICAAUTOISO1A_ISOLATION.json').read_text())
          test=json.loads((root/'LEICAAUTOISO1A_TEST_REPORT.json').read_text())
          assert proof['revision']=='LEICAAUTOISO1A'
          assert proof['isoDomain']=='physical_Camera2_SENSOR_SENSITIVITY'
          assert proof['menuPhysicalIso']==[320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000]
          assert proof['manualIsoAuthorityPreserved'] and proof['manualShutterAuthorityPreserved']
          assert proof['automaticShutterPreservesEnergyWhenCapHits']
          assert proof['selectedCapNeverExceededByAutomaticIso']
          assert proof['controlIdentityIncludesAutoIsoMaximum']
          assert proof['previewAndCaptureShareSamePlan']
          assert not proof['HDR']
          assert test['status']=='PASS'
          for rel,want in proof['frozenPhotographicHashes'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==want,rel
          contrast=root/'app/src/main/assets/mono/mono_contrast_curves.bin'
          assert contrast.is_file() and contrast.stat().st_size==10240
          assert hashlib.sha256(contrast.read_bytes()).hexdigest()=='ac010ac0a107fb4b98ed817f24b4b9ab2d739fcfd70571b4f7d8375335e293c6'
          print(json.dumps({
            'revision':'LEICAAUTOISO1A_POLICY',
            'physicalIsoMenu':proof['menuPhysicalIso'],
            'defaultPhysicalIso':proof['defaultPhysicalIso'],
            'manualIsoAuthorityPreserved':True,
            'manualShutterAuthorityPreserved':True,
            'energyPreservedWherePhysicalShutterRangeAllows':True,
            'previewCaptureSharedPlan':True,
            'renderAndLinearDngMathFrozen':True,
            'contrastToningSharpnessFrozen':True,
            'contrastAssetGeneratedOnlyInCI':True,
          },indent=2))
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Run modern Monochrom regression tests
        shell: bash
        run: |
          set -o pipefail
          cd modern
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest             --tests '*ZoomControllerTest'             --tests '*MonoUpstream1A*'             --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/LEICAAUTOISO1A_GRADLE_TESTS.log"

      - name: Build directly installable APK
        shell: bash
        run: |
          set -o pipefail
          cd modern
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/LEICAAUTOISO1A_GRADLE.log"

      - name: Package and verify APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee LEICAAUTOISO1A_APK_PROOF.txt
          from pathlib import Path
          import hashlib,json,shutil,zipfile
          root=Path('modern')
          apks=list((root/'app/build/outputs/apk/debug').glob('*.apk'))
          assert len(apks)==1,apks
          out=Path('MMonochrome_LEICAAUTOISO1A.apk')
          shutil.copyfile(apks[0],out)
          with zipfile.ZipFile(out) as z:
              names=set(z.namelist())
              assert 'assets/mono/mono_contrast_curves.bin' in names
              assert 'assets/mono/mono_sharpness5.bin' in names
              contrast=z.read('assets/mono/mono_contrast_curves.bin')
              sharp=z.read('assets/mono/mono_sharpness5.bin')
              assert hashlib.sha256(contrast).hexdigest()=='ac010ac0a107fb4b98ed817f24b4b9ab2d739fcfd70571b4f7d8375335e293c6'
              tables=json.loads(Path('LEICASHARPNESS1C_TABLES.json').read_text())
              assert hashlib.sha256(sharp).hexdigest()==tables['assetSha256']
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for marker in [
                  b'LEICAAUTOISO1A',
                  b'getMonoAutoIsoMaximumValue',
                  b'applyMonoAutoIsoMaximum1D',
                  b'autoIsoMaximumApplied',
                  b'MonoSharpness1C',
                  b'MonoToning1A',
              ]:
                  assert marker in dex,marker
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('LEICAAUTOISO1A_APK_SHA256.txt').write_text(digest+'  '+out.name+'\n')
          print('PASS directly installable Auto ISO APK',out.name,digest,out.stat().st_size)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-LEICAAUTOISO1A-EVIDENCE
          path: |
            LEICAAUTOISO1A_*.log
            LEICAAUTOISO1A_*.txt
            LEICAAUTOISO1A_*.json
          if-no-files-found: warn

      - name: Upload validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrome-LEICAAUTOISO1A
          path: |
            MMonochrome_LEICAAUTOISO1A.apk
            LEICAAUTOISO1A_APK_SHA256.txt
            LEICAAUTOISO1A_APK_PROOF.txt
            LEICAAUTOISO1A_POLICY_PROOF.txt
          if-no-files-found: error
