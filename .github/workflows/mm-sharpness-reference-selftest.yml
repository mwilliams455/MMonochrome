name: M Monochrom Sharpness Reference Selftest

on:
  workflow_dispatch:
  push:
    branches:
      - research/mm-sharpness-lutbank1a
    paths:
      - '.github/workflows/mm-sharpness-reference-selftest.yml'
      - 'tools/recover_leica_m9_mm_shared_key.py'
      - 'tools/mm_lutbank_geometry_probe.py'
      - 'tools/mm_sharpness_reference.py'
      - 'tools/pwad.py'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts
        run: |
          set -euo pipefail
          python3 -m py_compile tools/recover_leica_m9_mm_shared_key.py tools/mm_lutbank_geometry_probe.py tools/mm_sharpness_reference.py tools/pwad.py
      - name: Download and decrypt canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmsharpref"
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmsharpref/m9.upd" 'https://reddotforum.com/Firmware_files/M9%2C%20M9-P%2C%20M-E/m9-1_216.upd'
          curl --fail --location --retry 4 --retry-all-errors -o "$RUNNER_TEMP/mmsharpref/mm.upm" 'https://reddotforum.com/Firmware_files/M%20Monochrom/Mm-1_022.upm'
          python3 tools/recover_leica_m9_mm_shared_key.py "$RUNNER_TEMP/mmsharpref/m9.upd" "$RUNNER_TEMP/mmsharpref/mm.upm" --mm-out "$RUNNER_TEMP/mmsharpref/mm.dec" --meta-out "$RUNNER_TEMP/mmsharpref/recovery_meta.json"
      - name: Run exact host oracle self-test
        run: |
          set -euo pipefail
          python3 tools/mm_sharpness_reference.py "$RUNNER_TEMP/mmsharpref/mm.dec" --self-test --out "$RUNNER_TEMP/mmsharpref/MM_SHARPNESS_REFERENCE_VECTORS1A.json"
      - name: Publish derived reference vectors only
        uses: actions/upload-artifact@v4
        with:
          name: MMonochrom-SHARPNESS-REFERENCE1A
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mmsharpref/recovery_meta.json
            ${{ runner.temp }}/mmsharpref/MM_SHARPNESS_REFERENCE_VECTORS1A.json
      - name: Remove firmware material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mmsharpref/m9.upd" "$RUNNER_TEMP/mmsharpref/mm.upm" "$RUNNER_TEMP/mmsharpref/mm.dec"

# REFERENCE1A: intentional push trigger after workflow registration.
